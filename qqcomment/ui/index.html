<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小菇爱评论</title>
<!--
  面板。⭐ 这一整个目录【可以远程更新】(DESIGN §18)—— 改了不用重装 APK。

  和原生的接口只有两根线:
    原生 → 这里   window.画(快照json)      每次状态变了推一次
    这里 → 原生   安卓.意图(意图json)      见 core/快照字段.md §6

  ⚠️ 护栏:
    · 远程版必须签名校验 —— 这个文件被换掉 = 任意代码在你的 WebView 里跑
    · assets/ 里这一份是【保底】,远程拉挂了要退得回来
    · 不写 inline onclick —— 引号要在 JS 字符串里再转义一层,写错了整个脚本都不跑。踩过。

  布局和配色照 ../../../../../mockup/ 的定稿,结论在 mockup/UI决策.md:
    屏① 运行 → v6 第1张 · 屏④ 账号 → v20/v21 · 屏⑤ 加号 → v25
  ⚠️ 打样里的数字是【逐像素量过的】(名字起始 x=50、两热区中心距 248px…),
     照抄,别凭手感改。要改先回去改打样并重新量。
-->
<style>
  :root{
    /* 🔴 2026-11-09 UI 风格(打样 v49 方案 B + v50 的「整体 +1」)。
       --paper 原来是 #fff —— 页面和卡片同色,只靠 1px 浅灰边分区,
       手机上那条线基本看不见,用户原话「太素 / 区域也有点不明确」。
       现在:**页面退成浅灰、卡片保持白**,靠底色差把区域立起来。
       ⚠️ 只动颜色,不动任何尺寸关系。 */
    --paper:#eef0f3; --card:#fff;
    --ink:#16181c; --ink2:#5b6270; --ink3:#8d95a3;
    --line:#e6e8ec; --soft:#f5f6f8; --acc:#2f6be6; --accbg:#eaf1ff;
    --ok:#1f8b5f; --okbg:#e6f5ee; --warn:#b3730a; --warnbg:#fdf2e0; --warnline:#f0d9a8;
    --bad:#c23b36; --badbg:#fdecec;
    /* 版本页专用:只给「时间」用。见 .vt 那一段 */
    --time:#7b4fc4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink);
       font:14.5px/1.65 system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;flex-direction:column;overscroll-behavior:none}

  /* ── 顶栏 ── */
  .top{display:flex;align-items:center;gap:10px;padding:10px 13px;
       border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--card)}
  .top h1{font-size:18px;font-weight:500;flex:1;min-width:0;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ⚠️ 页面屏的顶栏里放的是【真按钮 + 状态】,不是一行标题文字 —— 要能 flex。
     ⚠️ 这一屏的顶栏要【压扁】:两行(工具栏 + 页签)本来就比原来多占一截,
        实测不收的话顶部从 120 涨到 221 设备像素,差不多翻倍 —— 那是从浏览器身上抠走的。 */
  .top h1.pagebar{display:flex;align-items:center;overflow:visible;margin:-5px 0}
  .tbtn{font-size:15px;font-weight:700;color:var(--acc);white-space:nowrap;flex:0 0 auto}
  .tbtn.mute{color:var(--ink3)}

  /* 跑条:干跑是黄的,真发是红的 —— 真发是唯一会在别人评论区留下东西的状态,
     不该和测试长一个样。不跑的时候整条不存在(display:none,高度 0)。 */
  .runbar{display:none}
  .runbar.on{display:flex;align-items:center;gap:6px;padding:6px 12px;
             font-size:12px;line-height:1.5;border-bottom:1px solid var(--warnline)}
  .runbar.gan{background:var(--warnbg);color:#7a6224}
  .runbar.real{background:var(--badbg);color:var(--bad);border-bottom-color:#f0c2c0}
  .runbar b{font-weight:700}
  .runbar .stage{margin-left:auto;background:#fff;border:1px solid var(--warnline);
                 border-radius:20px;padding:1px 8px;font-size:11px;white-space:nowrap}
  .runbar.real .stage{border-color:#f0c2c0}
  .banner{background:var(--warnbg);color:#7a6224;font-size:12.5px;line-height:1.7;
          padding:8px 13px;flex:0 0 auto;display:none}

  /* ── 主体 ── */
  .body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:11px 13px;
        display:flex;flex-direction:column;gap:8px;
        /* 🔴 键盘弹起来时把底下那块地让出来 —— 值由文件末尾的 盯键盘() 写。
           窗口自己会缩(adjustResize)的时候这个值恒为 0,等于没加。 */
        padding-bottom:calc(11px + var(--键盘, 0px))}

  /* 🔴🔴 「编辑任务 / 新增任务」是一【页】,不是弹窗(2026-11-08)。
     原来它住抽屉:`position:fixed; inset:0` + `.sheet{bottom:0; max-height:88%}`。
     那个形状和手机键盘必然打架,两种模式都坏,而且坏法不一样:
       · 窗口会缩(adjustResize)-> 88% 是缩完之后的 88%,抽屉变成一条缝
       · 窗口不缩(adjustPan;manifest 没声明 windowSoftInputMode,系统自己挑)
         -> 抽屉钉在 bottom:0,整个被键盘盖住
     用户 2026-11-08 实机报「根本编辑不了」。
     ⚠️ 这推翻了 2026-10-26 那个决定(CLAUDE.md 18.11「编辑器住进抽屉」)。
        当时的理由是「整页替换会把运行状态一起盖掉」—— 那个代价是真的,
        但它换来的是「在手机上压根编辑不了」。编辑的时候看不见进度,
        按一下取消就回来了;编不了是编不了。
     ⚠️ 编辑态里【底栏藏起来】:这一页只有两个出口(右上角取消 · 底下保存)。
        留着底栏就多一条暗路 —— 点一下 tab,没存的改动悄悄没了。
        顺带把那 ~56px 还给内容,键盘弹着的时候这点高度很值钱。 */
  body.编辑态 #底栏{display:none}

  /* ── 底栏 ── */
  /* 页面 TAB 的账号页签条(浏览器式)。
     ⚠️ 和药丸的全部区别在这一条:**当前页是白的、往上和工具栏连成一片**,
        别的页退在灰底里 —— 一眼看出上面那两个按钮和那行状态属于哪一页。
        药丸做不到:两个都浮在灰条上,看着像两个并列的按钮,和工具栏没关系。
     ⚠️ 2026-10-24 起【一直显示】,哪怕只开 1 个窗 ——
        关闭入口永远在同一个地方,不随窗口数换地方。 */
  .tabs{display:none;align-items:flex-end;flex:0 0 auto;overflow-x:auto;
        background:#eceef1;padding-left:10px;white-space:nowrap;
        -webkit-overflow-scrolling:touch}
  .tabs.on{display:flex}
  .tab{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
       color:var(--ink2);padding:4px 9px 5px 11px;font-size:12.5px}
  .tab.now{background:var(--paper);color:var(--ink);border-radius:0 0 9px 9px;
           padding:5px 9px 6px 11px;position:relative;top:-1px}
  .tab .x{font-size:14px;line-height:1;opacity:.42;padding:0 2px}
  .tab.now .x{opacity:.55}
  /* 原来是个 5px 的绿点 —— 用户 2026-10-24:「是绿色的点,不是很理解」。
     换成一个字。它同时回答两件事:这是哪个号在跑 + 为什么这一页没有 ×。 */
  .tab .run{font-size:10px;color:#fff;background:var(--ok);border-radius:4px;
            padding:0 4px;line-height:1.6;flex:0 0 auto;font-weight:700}
  .tabsn{margin-left:auto;flex:0 0 auto;font-size:11px;color:var(--ink3);padding:0 10px 5px 0}
  /* 顶栏左边那两个。⚠️ 以前是按 x 坐标切的【隐形点击区】——
     没样子、没反馈、手指偏一点就没反应。现在是真按钮。 */
  .navbtn{display:inline-flex;align-items:center;justify-content:center;
          width:28px;height:28px;border:1px solid var(--line);border-radius:8px;
          color:var(--ink2);font-size:16px;flex:0 0 auto;margin-right:8px}
  .navbtn:active{background:var(--soft)}
  /* 🔴 引擎在这一页上发评论时,‹ ↻ 换成这个。刻意【不是钮】——
     没边框、没按下反馈,一眼就看得出点不了(「假入口比没入口更坏」)。*/
  .navlock{display:inline-flex;align-items:center;font-size:12px;color:var(--ink3);
           flex:0 0 auto;margin-right:8px}
  .nav{display:flex;border-top:1px solid var(--line);flex:0 0 auto;
       background:var(--card);
       padding-bottom:env(safe-area-inset-bottom)}
  /* ⚠️ 5 个 tab:每格 20%(原来 4 个是 25%)。字号 10 → 9.5px,
     300dp 宽时每格 60px,图标 + 两个字仍放得下(打样 v26 量过)。 */
  .nav div{flex:1;text-align:center;font-size:11.5px;color:var(--ink3);
           line-height:1.45;padding:7px 0 9px}
  .nav div b{display:block;font-size:22px;font-weight:400}
  .nav .on{color:var(--acc)}

  /* ── 通用件 ── */
  /* ⚠️ `background` 是 2026-11-09 补的 —— 原来没有,白页白卡才会糊成一片。 */
  .card{border:1px solid var(--line);border-radius:11px;padding:10px 11px;flex:0 0 auto;
        background:var(--card);box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .kv{display:flex;font-size:14.5px;padding:2px 0}
  .kv>span:first-child{color:var(--ink3);width:80px;flex:0 0 auto}
  .kv>span:last-child{flex:1;min-width:0}
  .log{background:var(--card);font:11px/1.75 ui-monospace,monospace;color:var(--ink2);
       background:var(--soft);border-radius:9px;padding:8px 10px;
       white-space:pre-wrap;word-break:break-all;flex:0 0 auto}
  /* 日志里的号名(见 日志块)。⚠️ 不斜体 —— 斜体等宽字常常退化成假斜,糊成一团。
     ⚠️ 也【不加粗】:每条都有,加粗就是整块都在喊。靠色相认,不靠重量。 */
  /* ⚠️ 用 --ink 不用 --acc:这一块里蓝色一律等于【能点】(跳过/跑着/› 都是),
     日志是只读的,染成蓝的会被当成钮。要的是「比正文深一档」,不是「像链接」。 */
  .log i{font-style:normal;color:var(--ink)}
  .hint{font-size:12.5px;color:var(--ink3);line-height:1.8}
  .big{width:100%;border:none;border-radius:11px;padding:14px 0;
       font-size:18px;font-weight:500;background:var(--acc);color:#fff;flex:0 0 auto}
  .big.off{background:#d9dde3;color:#fff}
  .big.stop{background:#fff;color:var(--bad);border:1px solid var(--bad)}
  /* —— 跑着时底下那一排:[暂停] [停止](打样 v46 方案 B,用户 2026-11-05 定的)——
     ⚠️ **两个钮故意不一样宽**(用户原话:「暂停的宽度比停止小」)。
        2:1 —— 停止 236px / 暂停 115px(393 宽量的)。为什么要这样:
        并排两个一样大的钮等于**没有主次**,而跑着时最常按的出口是「停止」(铁律 18.8);
        宽度差把主次说清楚,顺带也让两个钮**手感不一样** —— 按错的那一下
        在摸到之前就知道不对。
     ⚠️ 符号也是分开的(用户:「两边可以加入符号」):▮▮ 暂停 / ▶ 继续 / ■ 停止。
        **全挑几何图形区**(U+25A0–U+25FF)—— 和账号屏那个 ▲▼ 同一块,
        真机上验过画得出来。⏸ 那个字符【没用】:安卓常把它当表情画,
        大小和颜色都不受我们控制(⠿ 就是这么变成两个小点的)。 */
  .btnrow{display:flex;gap:8px;flex:0 0 auto}
  .btnrow>.big{flex:2 1 0;min-width:0}
  .btnrow>.big.hold{flex:1 1 0}
  .big.hold{background:#fff;color:var(--ink2);border:1px solid var(--line)}
  .big.go{background:var(--acc);color:#fff}
  /* 「还没选号 —— 去账号挑」:能点,所以【不能长得像灰掉的】。描边蓝,和 .off 一眼分得开 */
  .big.ask{background:#fff;color:var(--acc);border:1px solid var(--acc)}
  /* 编辑器底部那行「删掉这个任务」(mockup v31 方案 B)。
     ⚠️ 刻意【不是钮】—— 删除是这一屏最少用、而且撤不回来的操作,
        原来它是整屏最大最红的东西,主次正好反了(用户 2026-10-25 指出)。
        现在主钮是「保存」,删除降成一行字。 */
  .delrow{text-align:center;font-size:13px;color:var(--bad);padding:10px 0;flex:0 0 auto}
  .ghost{border:1px solid var(--line);background:#fff;border-radius:9px;
         padding:12px 0;font-size:16px;color:var(--ink2);flex:1}
  .row{display:flex;gap:7px;flex:0 0 auto}

  /* 状态 pill */
  .pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:11px;
        background:var(--soft);color:var(--ink3)}
  .pill.run{background:var(--okbg);color:var(--ok)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  .pill.bad{background:var(--badbg);color:var(--bad)}

  /* ── 屏② 任务库(照 v18)── */
  /* 🔴🔴 2026-11-01 用户:「任务那页不是应该要整页滚动吗,跟插件一样。
     运行时的任务似乎不需要内卷?」—— 对的。**列表不再自己滚了,整页滚。**

     病根是这一条原来写的 `flex:0 1 auto`:`.body` 里**只有它会缩**
     (别的块全是 0 0 auto),于是它成了整页唯一的泄压阀 —— 页面永远不滚,
     内容一多全压在列表上。实测(预览,跑着 + 8 个任务):
     列表内容 513px,**框被压到 69px**(离 min-height 60 只差 9px)= 一次看一行,
     而 `.body` 的 scrollHeight 和 clientHeight 一样大,**整页一滚都不滚**。

     ⚠️ 插件就是整页滚的:`content.js` 的 `.panel` 自己
     `max-height:74vh;overflow-y:auto`,而 `task-panel.js` 里
     **overflow / max-height 一个都没有**。它唯一的内滚是 `.detail`(封 200px),
     那是展开的任务明细,不是列表。
     ⚠️ 规矩收成一句:**一个界面一个滚动容器**(页面是 `.body`、抽屉是 `.sheetbody`),
     里面的块一律自然高。唯一的例外是「长度不受我们控制的流」——
     现在只有运行日志(`.log.run` 封 34vh,理由见下面那段,是真机量出来的)。 */
  .listwrap{background:var(--card);box-shadow:0 1px 2px rgba(16,24,40,.05);flex:0 0 auto;min-height:60px;border:1px solid var(--line);
            border-radius:11px;position:relative;overflow:hidden}
  .list{padding:0 11px}
  /* ⚠️ 空白【只长不缩】照旧:内容短的时候把「开始」顶到屏幕最底下;
     内容一长它自己变 0,接着就是整页滚。两种情况同一条规则管。 */
  .sp{flex:1 1 0;min-height:0}

  /* 🔴 运行区的日志【必须封高】。
     合屏之后主钮在最底下,日志一长就把「停止」顶出屏幕 ——
     2026-10-27 真机实测:20 条日志时钮底 694px、可视区只有 690px,差 4px 就是按不到。
     打样时按 2~3 行日志画的,而真日志每条常常折成两行,14 条就是 20+ 行。
     封高之后整页高度固定,钮永远在;要翻旧的就在这个框里滚。 */
  .log.run{max-height:34vh;overflow:auto;-webkit-overflow-scrolling:touch}

  /* ── 过往运行日志的日子页签(打样 v45)──
     ⚠️ 抽屉里那一份【不加 .run】—— 抽屉的滚动容器是 `.sheetbody`,
        里面再封一层高 = 一个界面两个滚动容器(18.13)。自然高就对了。 */
  .daypick{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
  .daypick span{font-size:12px;padding:3px 10px;border-radius:20px;
                background:var(--soft);color:var(--ink3);
                border:1px solid var(--line)}
  .daypick span.on{background:var(--accbg);color:var(--acc);border-color:#cfe0ff}
  .daypick span.none{opacity:.45}

  /* ── 抽屉(打样 v38)──
     ⚠️ 2026-11-08 起【只剩「过往运行日志」一样东西】。编辑任务搬出去变成一页了,
        理由见上面 `body.编辑态` 那段。
     ⚠️ 日志抽屉【没有输入框】,所以不吃键盘那个亏 —— 别顺手把它也改成页。
     ⚠️ 浮在上面,**页面高度一点不变** —— 用户 2026-10-26 否掉「就地展开」就是因为
        「点开任务时画面会拉长」。抽屉没有这个问题。
     ⚠️ `position:fixed` 而不是 absolute:面板整个是 flex 柱子,
        absolute 会相对某个莫名其妙的祖先定位。 */
  #抽屉{position:fixed;inset:0;z-index:40;display:none}
  #抽屉.on{display:block}
  .dim{position:absolute;inset:0;background:rgba(15,23,42,.3)}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--soft);
         border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(15,23,42,.2);
         max-height:88%;display:flex;flex-direction:column}
  .grab{width:34px;height:4px;border-radius:3px;background:var(--line);
        margin:7px auto 0;flex:0 0 auto}
  .sheethd{display:flex;align-items:center;gap:10px;padding:9px 13px;
           border-bottom:1px solid var(--line);background:#fff;flex:0 0 auto}
  .sheethd b{flex:1;font-size:15px}
  .sheetbody{padding:11px;display:flex;flex-direction:column;gap:9px;
             overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
  .item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .t1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{font-size:11.5px;padding:2px 7px;border-radius:20px;display:inline-block;
       background:var(--soft);color:var(--ink3);margin-right:4px}
  .tag.acc{background:var(--accbg);color:var(--acc)}
  .tag.bad{background:var(--badbg);color:var(--bad)}
  .sm{border:1px solid var(--acc);color:var(--acc);background:var(--accbg);
      border-radius:9px;padding:4px 11px;font-size:12.5px;flex:0 0 auto}
  /* 灰掉的小钮:有毛病的任务、以及【跑着的时候】。一次只跑一个任务,别让人误触重开一轮 */
  .sm.off{border-color:var(--line);color:var(--ink3);background:var(--soft)}
  /* —— 任务行右边那一格的【状态】(打样 v47 方案 B,用户 2026-11-05 定的)——
     🔴 这一格平时装的是「发」—— 一个**真能点的钮**。跑起来之后原地换个东西,
        只要它还长得像钮,读出来就是「这个钮被按下去了」。用户原话:
        「跟继续钮或完成钮颜色太近,以为是什么可以点的」—— 那之前是 `.sm.now`(实心蓝),
        而实心蓝在这个 App 里只给主钮用(继续 / 完成 / 开始)。
     → **没有框、没有底**,就不可能被当成钮。这条线在这个 App 里一直是:
        **钮有边框,状态没有**(账号屏那些「有效」「不轮换」小标也是无边框的)。
     ⚠️ 绿色是【跟顶上那个「跑」药丸对齐的】(`.pill.run` 同一对变量)——
        一屏里说同一件事就用同一个颜色。而且绿色在这个 App 里**从来不是按钮**
        (钮只有蓝和红),撞不上「可点」的联想。
     ⚠️ 小圆点替「正在进行」说话。**别给它加动画** —— 列表里一个会动的点是噪音,
        而且快照每 250 毫秒重绘一次,动画每次都会被打断重来。 */
  .st{font-size:12px;color:var(--ok);flex:0 0 auto;white-space:nowrap}
  .st.wait{color:var(--ink3)}
  .st .dot{display:inline-block;width:5px;height:5px;border-radius:50%;
           background:var(--ok);margin-right:4px;vertical-align:1px}
  /* ⚠️ `.sm.now`(实心蓝)2026-11-05 删了 —— 它唯一的用处是任务行那个「跑着」,
     而那个已经改成 `.st` 纯文字了(打样 v47 方案 B)。**两头一起拆**:
     render 和 CSS 同时没,grep 两边都搜不着。
     (页面屏那排页签的 `.tab.now` 是另一条规则,别混。) */
  .fold{border:1px solid var(--line);border-radius:10px;padding:9px 11px;
        background:var(--card);box-shadow:0 1px 2px rgba(16,24,40,.05);
        display:flex;align-items:center;gap:8px;font-size:13.5px;flex:0 0 auto}

  /* 🔴 参数展开:这一行和下面那三块【连成一张卡】(打样 v52 方案 D)。
     为什么要连:不连的话屏幕上是四个互不相干的盒子,看不出是从哪一行展开的
     —— 用户 2026-11-10 的原话是「不太明白怎么缩起来」。
     ⚠️ `margin-top:-8px` 是在抵消 `.body` 的 `gap:8px`。改 gap 的时候记得这儿。
     ⚠️ 只作用在 `.foldbody` 的直接子块上 —— 不能用 `~`,
        后面还跟着「参与轮换」那张 `.card`,会被误伤。 */
  .fold.on{border-bottom-left-radius:0;border-bottom-right-radius:0;
           border-bottom:none;box-shadow:none;background:var(--soft)}
  .fold.on .k{font-weight:600;color:var(--ink)}
  .foldbody{margin-top:-8px;display:flex;flex-direction:column;flex:0 0 auto}
  .foldbody>.blk{border-radius:0;border-top:none;box-shadow:none;margin:0}
  .foldbody>.blk+.blk{border-top:1px solid var(--line)}
  .foldbody>.blk:last-child{border-bottom-left-radius:11px;
                            border-bottom-right-radius:11px;
                            box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .fold .k{color:var(--ink3);width:52px;flex:0 0 auto}   /* 两个折叠对齐,都 52px */
  .ck2{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);
       flex:0 0 auto;display:flex;align-items:center;justify-content:center;
       font-size:11px;color:#fff}
  .ck2.on{background:var(--acc);border-color:var(--acc)}
  .tbtn.pick{color:var(--ink3)}
  .tbtn.pick.on{color:var(--acc);background:var(--accbg);border-radius:20px;padding:2px 9px;margin:-2px -3px}

  /* ── 屏③ 编辑器(照 v22)── */
  .fr{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap}
  .lb{font-size:13.5px;color:var(--ink2);flex:0 0 auto}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
  .seg div{padding:5px 15px;font-size:13px;color:var(--ink2)}
  .seg div.on{background:var(--acc);color:#fff}
  .inp{border:1px solid var(--line);border-radius:8px;padding:7px 9px;
       font-size:13.5px;color:var(--ink);background:#fff;min-width:0;font-family:inherit}
  .inp:focus{outline:none;border-color:var(--acc)}
  /* ── 「目标页面」的剧集直通链(mockup v30 方案 D1)──
     交互:一个控件走到底。清单最后一项是「✎ 自己填…」,挑它就变输入框。
     ⚠️ 列表【自己画】,不用 <select> —— 原生 select 一点开弹的是安卓系统那个
        方方正正的列表,CSS 一点都改不动,用户 2026-10-25 说「有点俗」就是指它。
     ⚠️ 圆角/间距刻意跟卡片、账号卡、冷却框同一套 —— 不然像别的 App 的零件。*/
  .wrap{position:relative;flex:1;min-width:0}
  /* 73 = 钮宽 61 + 右边距 4 + 8 留白。实测 62 时文字会压到钮底下 */
  .wrap input.inp{width:100%;padding-right:73px}
  .trig{width:100%;text-align:left;background:#fff;border:1px solid var(--line);
        border-radius:10px;padding:7px 28px 7px 11px;font-family:inherit;position:relative}
  .trig .nm{font-size:13.5px;color:var(--ink);display:block}
  .trig .u{font-size:11.5px;color:var(--ink3);display:block}
  .trig::after{content:'';position:absolute;right:11px;top:50%;width:6px;height:6px;
      border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);
      transform:translateY(-70%) rotate(45deg)}
  .pop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;
       border:1px solid var(--line);border-radius:14px;z-index:9;padding:5px;
       box-shadow:0 12px 30px rgba(15,23,42,.13)}
  .pop .it{padding:8px 10px;border-radius:9px}
  /* 当前选中那条染蓝 —— 打开就知道现在是哪个 */
  .pop .it.on{background:var(--accbg)}
  .pop .nm{font-size:13.5px;color:var(--ink);display:block}
  .pop .u{font-size:11.5px;color:var(--ink3);display:block}
  .pop .sep{height:1px;background:var(--line);margin:5px 9px}
  .pop .self{padding:8px 10px;border-radius:9px;font-size:13px;color:var(--acc)}
  .back{position:absolute;right:4px;top:50%;transform:translateY(-50%);
        border:0;background:var(--accbg);color:var(--acc);border-radius:7px;
        padding:4px 8px;font-size:11.5px;line-height:1;font-family:inherit}
  .num{width:62px;text-align:center}
  .grow{flex:1}
  .ta{width:100%;min-height:96px;resize:vertical;line-height:1.7}
  .blk{background:var(--card);box-shadow:0 1px 2px rgba(16,24,40,.05);border:1px solid var(--line);border-radius:10px;padding:10px 11px;
       display:flex;flex-direction:column;gap:8px;flex:0 0 auto;position:relative}
  /* ⚠️ 冷却关掉时【置灰】不是 hidden —— 不跳版,而且看得见自己关了什么(UI决策.md §3) */
  .blk.off{opacity:.45;pointer-events:none}
  .bt{position:absolute;top:-8px;left:10px;background:#fff;padding:0 6px;
      font-size:11px;color:var(--ink3)}
  .bt.warm{color:var(--warn)}

  /* ── 账号行(照 v21 量过的尺寸,别改)── */
  /* ⚠️ background 是 2026-11-09 补的 —— 页面退成浅灰之后,
     坐在页面上却没有底色的块会【变成灰的】,比白底白卡更糊。
     漏过一次:v6 发出去才在设备上扫出来(.prow/.entry/.blk 三个)。 */
  .prow{background:var(--card);box-shadow:0 1px 2px rgba(16,24,40,.05);border:1px solid var(--line);border-radius:10px;padding:8px 10px;
        display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .prow.norot{background:#fafafa}
  .prow.run{border-color:var(--acc);background:#f7faff}
  /* ⚠️⚠️ 2026-10-30 头像【去掉了】—— 用户:「我觉得不必显示头像了吧,太占位了」。
     它只有两个用处,两个都是重复的:
       · 名字首字 —— 名字就在右边 3px 处
       · 跑不了时变红 —— 徽章已经写着「失效/任务失败」,整行底色也会变灰(.prow.norot)
     省下 39px(30 头像 + 9 gap)全给摘要行,那一行一直在打架(253 → 292px)。
     ⚠️ v21 当初写死这 30px 是为了「切编辑轮换时名字起始 x 不变、整行不横跳」。

     ⚠️⚠️ 2026-11-01 用户:「39px 那个治一下」—— 横跳治了,但【不是把 30px 加回来】。
        那一格现在**两个模式都有,而且是同一条 CSS**(下面这行),宽度不可能再岔开:
          · 视图模式 = ▸/▾ (从名字行里搬出来的,本来就在最左边,只是没有自己的格子)
          · 编辑模式 = 勾选框
        宽度按**勾选框的真尺寸** 20x20 定死 20px(原来 30px 是头像的尺寸,
        勾选框在里面两边各空 5px)。所以代价从 39px 降到 29px(20 + 9 gap),
        而且换来的是「▸ 有了固定的一列」—— 名字行少了一个会动的前缀。
        ⚠️ 勾选框热区没变(`data-勾` 一直在 20x20 的 .ck 上,不在格子上);
           离右边那一格反而远了 5px(v20 量的中心距 248px -> 253px)。
           ⚠️ 2026-11-05 右边那一格从 ⠿ 换成 ▲▼ 了,这个距离跟着变小
           (▲ 的中心比 ⠿ 靠左约 50px)—— 但「两热区离得远」这件事还是靠这一格撑着,
           改左边这 20px 之前先看一眼右边现在有多宽。 */
  /* ⚠️ 这一行是「两个模式名字不横跳」的【唯一】依据 —— 改宽度就两边一起改,没有第二处 */
  /* ⚠️ 对齐也写在这一条里 —— ▸ 和勾选框要落在【同一个像素】上,切模式时那一格一动不动。
     量过:名字行在行内 y=9、高 20,勾选框也正好 20x20,所以
     stretch + flex-start 让两个都压在名字那一行上(整行是两行高 —— 摘要行在下面,
     居中会让它们掉进两行中间的缝里,而且两个模式掉的位置还不一样)。 */
  .slot{width:20px;flex:0 0 auto;display:flex;align-self:stretch;
        align-items:flex-start;justify-content:center}
  .slot.tri{line-height:20px;font-size:13.5px}
  .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid #cfd4db;
      display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .ck.on{background:var(--acc);border-color:var(--acc)}
  .meta{flex:1;min-width:0}
  .name{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ⚠️ 账号行专用。普通 .name 是「整行一起截」—— 那样截掉的是【尾巴上的徽章】,
     而徽章正是诊断本身(「信息库破损,须重启」比名字要紧得多)。
     2026-10-29 实测:名字长 + 任务运行中 + 长徽章 = 徽章被切掉 40px。
     改成 flex 之后截的是名字,徽章永远完整 —— 名字猜得出来,徽章猜不出来。 */
  .name.pn{display:flex;align-items:center;gap:4px}
  .name.pn>.nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .name.pn>.badge{flex:0 0 auto}
  /* ⚠️⚠️ 2026-10-29 用户:「每个帐号都应该显示状态,即使『任务失败』也应该要显示」。
     原来是 nowrap + ellipsis 单行,而 ellipsis 从尾巴切 —— 切掉的正好是
     排在最后的「任务失败(原因)」和「今日 N 条」。量过:最糟那行要 327px,
     行宽只有 253px。**不能靠挪顺序解决** —— 挪谁到前面都等于牺牲另一个,
     而状态和失败原因用户两个都要。所以改成最多折 2 行(506px 预算,
     实测最长的真原因「服务器回的不是 JSON」也只占半行多)。
     ⚠️ 留着 line-clamp 的封顶:`页面加载失败:` 后面接的 e.原因 长度不受我们控制,
     不封顶的话一个烂 URL 能把这一行撑成五行、整个列表走形。超了照样打省略号。
     ⚠️ overflow-wrap:anywhere 是给 ASCII 原因(net::ERR_… 这种没空格的)用的,
     中文本来就能随处断。 */
  .rowinfo{font-size:12px;color:var(--ink3);margin-top:1px;line-height:1.45;
           display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
           overflow:hidden;overflow-wrap:anywhere}
  /* ── 设置屏:一行入口(打样 v48 方案 C)──
     ⚠️ 右边那一格是【现状】不是说明:用户下来是找「我那个值现在是几」的,
        不是来读一句介绍的。空着也行(维护那一行就没有)。 */
  .entry{background:var(--card);box-shadow:0 1px 2px rgba(16,24,40,.05);display:flex;align-items:center;gap:8px;border:1px solid var(--line);
         border-radius:11px;padding:11px;flex:0 0 auto}
  .et{font-size:14px;flex:1;min-width:0}
  .ev{font-size:12.5px;color:var(--ink3);white-space:nowrap}
  .ea{font-size:14px;color:var(--ink3)}

  /* ── 版本信息页 ──
     🔴 抄的是小菇爱表白那一页的约定,理由它自己写着:这一页上
        `1.3` / `4` / `v2` / `11-09 14:22` 挨着放,**光看数字分不清谁是谁**。
        所以给两道保险:
          版本号 → 蓝 + 后面跟一个「版」字
          时间   → 另一个色 + 前面带一个「于」字
     ⚠️ 紫色是这个 App 里【唯一】不表示「能点」的强调色。蓝 = 能点这条规矩
        在日志那边记过(18.14),版本号用蓝是因为它本来就在卡里、周围没有钮;
        时间要是也用蓝,一行里两种蓝就又分不清了。 */
  .vhd{font-weight:600;color:var(--ink);font-size:13.5px}
  .vline{font-size:13.5px;line-height:1.95}
  .vsm{font-size:12.5px}
  .vn{font-weight:700;color:var(--acc)}
  .vt{color:var(--time)}
  .vg{color:var(--ink3)}
  .vok{color:var(--ok)}
  .vbad{color:var(--bad)}

  .badge{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--accbg);color:var(--acc)}
  .badge.dead{background:var(--badbg);color:var(--bad)}
  .badge.norot{background:var(--soft);color:var(--ink3)}
  .ops button{border:1px solid var(--line);background:#fff;border-radius:7px;
              padding:6px 11px;font-size:13px;color:var(--ink2)}
  .ops button.hot{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
  /* —— 换顺序:▲▼(照插件 content.js moveProfile)——————————
     🔴 2026-11-05 这里【原来是 ⠿ 拖动】。v20 当初选它是为了「两个热区离得远」:
        ⠿ 在最右、勾选框在最左,中心距 253px;▲▼ 挤在右边只有 48px,拇指一盖两个都中。
        **那条顾虑是真的,但它挡住的是一个从来没成功过的功能** —— 拖动为什么必炸,
        实拍证据写在 `画账号` 里那段注释上。
     —> 现在的办法是把两个钮做【够大 + 留缝】:42x36 + 8px 缝 = 中心距 50px,各自有边框。
        按错只发生在中间那几个像素上,而且按错 = 反方向挪一格,再点一下就回来;
        拖动那种错是「顺序根本没存下来、行还卡在半路」。两种错不是一个量级。
     ⚠️ 头一行的 ▲ / 末一行的 ▼ 是灰的 —— 这【不算】犯「不留灰钮」那条:
        那条禁的是「点了没反应、又不说为什么」,而这两个的理由明摆着(它已经是第一个了)。
        真拿掉的话右边那一格会忽宽忽窄,整列对不齐。 */
  .reord{display:flex;gap:8px;flex:0 0 auto}
  .reord button{width:42px;height:36px;border:1px solid var(--line);background:#fff;
                border-radius:8px;font-size:12px;color:var(--ink2);line-height:1;
                display:flex;align-items:center;justify-content:center}
  .reord button:disabled{opacity:.3}

  /* 展开的明细 */
  .detail{border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;
          margin-top:-7px;padding:9px 11px 10px;background:var(--soft);flex:0 0 auto}
  .bars{display:flex;align-items:flex-end;gap:5px;height:42px;margin:7px 0 3px;position:relative}
  .bar{flex:1;background:var(--acc);border-radius:2px 2px 0 0;min-height:2px}
  .bar.zero{background:#d9dde3}
  .goal{position:absolute;left:0;right:0;border-top:1px dashed #b6bcc5}
  .barx{display:flex;gap:5px;font-size:9.5px;color:var(--ink3)}
  .barx span{flex:1;text-align:center}
</style>
</head>
<body>

<div class="top">
  <h1 id="题">小菇爱评论</h1>
  <span class="tbtn mute" id="右1"></span>
  <span class="tbtn" id="右2"></span>
</div>

<div class="tabs" id="窗口条"></div>

<div class="banner" id="横幅"></div>

<!-- 跑的时候才出现。⚠️ 它一出现顶边就厚了 —— 报留边 里必须把它算进去,
     不然原生给浏览器留的边不够,浏览器会把它盖住(窗口条当年就是这么踩的)。 -->
<div class="runbar" id="跑条"></div>

<div class="body" id="内容"></div>

<!-- 抽屉:编辑任务 / 看这一趟跑哪几个,都从这里升起来(打样 v38)。
     ⚠️ 浮在上面,【页面高度一点不变】—— 用户 2026-10-26 否掉「就地展开」的理由就是
        「点开任务时画面会拉长,感觉不太对劲」。 -->
<div id="抽屉"></div>

<!-- ⚠️ 2026-10-27:「运行」没了,并进「任务」(打样 v32/v38)。
     理由:运行屏的「开始」跑的是勾选,而勾选只在任务屏看得到 ——
     在一个看不见后果的地方按开始。两屏又从不同时有用,合成一页按状态换内容。 -->
<!-- 🔴 2026-11-10 顺序改成「账号 → 页面 → 任务 → 设置」(用户指定)。
     原来是「任务 → 账号 → 页面 → 设置」。读起来是一条流水:
     先把号准备好 -> 看看页面 -> 再去跑任务 -> 设置垫底。
  ⚠️ `class="on"` 写在「账号」那一格上,但那只是**首帧**的样子 ——
     开机会 `换底栏(当前页)` 把它对齐到【上次停留的那一屏】(见 `读上次的屏`)。
     「账号」只是**第一次打开**(没存过记忆)时的落点。
  ⚠️ 顺序和默认屏是两件事,分开改的,别以为动一个另一个会跟着动。
  ⚠️ 每格认的是 `data-页`,不是位置,所以**派发那边一个字都不用改**。 -->
<div class="nav" id="底栏">
  <div class="on" data-页="账号"><b>◍</b>账号</div>
  <div data-页="页面"><b>◫</b>页面</div>
  <div data-页="任务"><b>☰</b>任务</div>
  <div data-页="设置"><b>⚙</b>设置</div>
</div>

<script>
'use strict';

var 快照 = null;
/**
 * 🔴 开机落哪一屏(用户 2026-11-10 定的):
 *   · **第一次打开**(没存过)-> 「账号」
 *   · 其他时候 -> **上次停留的那一屏**
 *
 * 存在面板自己的 `localStorage` 里 —— 它是「这个人上次看到哪儿」,
 * **不是业务事实**,所以不进状态机也不进快照(和 `设置页` / `弹层开的是`
 * 同一类,见 18.7)。原生一行都不用动 = 纯层 2。

function MB(n) {
  if (!n) return '—';
  if (n < 1048576) return Math.round(n / 1024) + 'KB';
