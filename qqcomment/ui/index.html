        `号失效` 记号清掉、再按「开始」是从第 1 轮第 1 个号重来。
        想歇十分钟的人要的根本不是这个(理由和状态机那边 `case '暂停'` 写的是同一条)。
     ⚠️ 钮写「暂停」还是「继续」,读的是快照 `手动暂停`,**不是** `当前状态 === '已暂停'`:
        按下去到真停住中间有个「收尾中」(等这条发完),那几秒人已经按过暂停了,
        再给他一个「暂停」是撒谎。
     ⚠️ 停止那个钮【一个字没动】—— 位置、颜色、通栏都照旧(只多了个 ■)。
        那个位置是 2026-10-27 改了三版才定下来的,别顺手动它。 */
  var 歇着 = !!s.手动暂停;
  h += '<div class="btnrow">'
     + '<button class="big hold' + (歇着 ? ' go' : '') + '" data-意图="'
     + (歇着 ? '继续' : '暂停') + '">' + (歇着 ? '▶ 继续' : '▮▮ 暂停') + '</button>'
     + '<button class="big stop" data-意图="停">■ 停止</button>'
     + '</div>';
  return h;
}

function kv(k, v) { return '<div class="kv"><span>' + k + '</span><span>' + v + '</span></div>'; }
// 2106 → 2,106。⚠️ 日志条数经常是四位数,不分节根本读不出是两千还是两万。
function 千分位(n) {
  var 文 = String(n == null ? 0 : n), 出 = '';
  for (var i = 0; i < 文.length; i++) {
    if (i > 0 && (文.length - i) % 3 === 0) 出 += ',';
    出 += 文.charAt(i);
  }
  return 出;
}
// confirm/alert 里的换行。⚠️ 【故意不写反斜杠转义】—— 经 heredoc 改这个文件时
//    会被吃掉一层变成真换行,那是 JS 语法错,整块 <script> 一行都不执行(铁律 18 ⑤)。
function 跳行() { return String.fromCharCode(10); }

/**
 * 把播放页网址缩短给下拉用。`https://v.qq.com/x/cover/mzc00200kon535w.html`
 * → `v.qq.com/…/mzc00200kon535w.html`
 *
 * ⚠️ 砍的是【中间】不是尾巴 —— 尾巴那串 cover id 正是区分两个剧的唯一依据,
 *    砍掉它选单里就会出现两行一模一样的东西。
 */
function 简网址(u) {
  var 文 = String(u || '').replace(/^https?:\/\//, '');
  var 段 = 文.split('/');
  if (段.length <= 3) return 文;
  return 段[0] + '/…/' + 段[段.length - 1];
}
/**
 * 「挑一个」控件(mockup v30 方案 D1)—— 目标页面和选评论池共用这一份。
 *
 * ⚠️ 做成共用的,是因为两边长得一样、行为也一样。各写一份迟早会岔开:
 *    改了一边的圆角/收起逻辑,另一边忘了改,就成了一屏两种脾气。
 *
 * 配置:{ 字段, 项们, 占位, 画一项(项)->html, 值的(项)->string }
 *   · 项们 = [{...}],每项由 值的() 给出它代表的值
 *   · 手填模式下就是个普通输入框 + 「↩ 挑」
 * ⚠️⚠️ 两种模式下都【必须】有一个 `data-字段="<字段>"` 的输入框(触发器模式下是
 *    hidden)—— `收草稿`/`填回草稿` 认这个属性。少了它,挑中那一下就得去写 `草稿`,
 *    而那正是会被 `重绘()` 开头的 `收草稿()` 盖掉的写法(铁律 18.6)。
 */
function 挑一个(c) {
  var 值 = (草稿 && 草稿[c.字段]) || '';
  var 配上 = null;
  for (var i = 0; i < c.项们.length; i++) {
    if (c.值的(c.项们[i]) === 值) { 配上 = c.项们[i]; break; }
  }
  // ⭐ `只能挑` = 不给「自己填」那条路(用户 2026-10-25:「选评论池不必自己写剧名」)。
  //    评论池必须是仓里真有的那个目录(`comments/<剧名>/0.txt`),手敲一个名字
  //    只会拉不到、白跑一趟。插件那边也是纯 select,没有手填。
  var 只挑 = !!c.只能挑;
  // null = 还没表态 → 看【这个值在不在清单里】。老任务存的是手敲的,
  // 不这么判的话打开编辑器只看到一个点不动的触发器,想改还得绕进弹层。
  // ⚠️ 清单是异步拉的,所以【渲染时现算】,不能开编辑器那一下算一次。
  var 手填 = 只挑 ? false
           : ((手填的[c.字段] == null) ? !!(值 && !配上) : 手填的[c.字段]);
  var h = '<div class="wrap">';
  if (手填 || (!c.项们.length && !只挑)) {
    h += '<input class="inp" data-字段="' + c.字段 + '" placeholder="' + esc(c.占位) + '">'
       + (c.项们.length ? '<button class="back" data-挑回="' + c.字段 + '">↩ 挑</button>' : '');
  } else {
    // ⚠️⚠️ 触发器模式下也【必须留一个 data-字段】(hidden)—— `收草稿`/`填回草稿`
    //    都认这个属性。少了它,挑中那一下就得去写 `草稿`,那正是铁律 18.6
    //    会被 `重绘()` 开头的 `收草稿()` 盖掉的写法。
    h += '<input type="hidden" data-字段="' + c.字段 + '">'
       + '<button class="trig" data-挑开="' + c.字段 + '"'
       + (c.项们.length ? '' : ' data-挑空') + '>';
    if (配上) {
      h += c.画一项(配上);
    } else if (值) {
      // 只挑模式下存着一个【清单里没有】的值 —— 多半是那个池从仓里撤了。
      // ⚠️ 不能只显示占位「还没选」:值其实还在(存下去也还是它),
      //    显示成「没选」会骗人。把它和原因一起摆出来,让人自己重挑。
      h += '<span class="nm" style="color:var(--warn)">' + esc(值) + '</span>'
         + '<span class="u" style="color:var(--warn)">清单里没有这个池了 —— 重挑一个</span>';
    } else if (!c.项们.length) {
      h += '<span class="nm" style="color:var(--ink3)">清单还没拉到 —— 点一下重试</span>'
         + '<span class="u">&nbsp;</span>';
    } else {
      h += '<span class="nm" style="color:var(--ink3)">' + esc(c.占位) + '</span>'
         + '<span class="u">&nbsp;</span>';
    }
    h += '</button>';
    if (弹层开的是 === c.字段 && c.项们.length) {
      h += '<div class="pop">'
         + c.项们.map(function (d) {
             return '<div class="it' + (c.值的(d) === 值 ? ' on' : '') + '"'
                  + ' data-挑中="' + esc(c.值的(d)) + '" data-挑给="' + c.字段 + '">'
                  + c.画一项(d) + '</div>';
           }).join('')
         + (只挑 ? ''
                : '<div class="sep"></div>'
                  + '<div class="self" data-挑手填="' + c.字段 + '">✎ ' + esc(c.手填字) + '</div>')
         + '</div>';
    }
  }
  return h + '</div>';
}


/**
 * 「上次登录」那一行。
 *
 * ⚠️ 腾讯给的是 `2026-9-26 8:43:29` 这种本地时间串,**月/日/时都不补零**,
 *    `new Date(那个串)` 在不同引擎上行为不一致 —— 自己按位拆,别交给 Date 去猜。
 * ⚠️ 算「几天前」可能因为时区差出几个钟头,所以**绝对时间才是主角**,
 *    相对时间只在算得出、而且不离谱的时候当后缀。
 */
/**
 * 「多久以前」。⚠️ 给那些【会过期的结论】用 —— 它们落了盘,重启后还在,
 *    不把时间一起显示就会被当成「现在的状态」。
 */
function 多久以前(戳) {
  if (!戳) return null;
  var 差 = Date.now() - 戳;
  if (差 < 0) return null;
  if (差 < 60000) return '刚刚';
  if (差 < 3600000) return Math.floor(差 / 60000) + ' 分钟前';
  if (差 < 86400000) return Math.floor(差 / 3600000) + ' 小时前';
  return Math.floor(差 / 86400000) + ' 天前';
}

function 登录时间(串) {
  if (!串) return null;
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/.exec(String(串).trim());
  if (!m) return { 文: String(串).slice(0, 16) };
  var 补 = function (n) { return (n < 10 ? '0' : '') + n; };
  var 文 = 补(+m[2]) + '-' + 补(+m[3]) + ' ' + 补(+m[4]) + ':' + m[5];
  var t = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime();
  var 差 = Date.now() - t;
  var 天 = Math.floor(差 / 86400000);
  var 尾 = '';
  if (差 >= 0 && 天 <= 400) {
    尾 = 天 >= 1 ? ' · ' + 天 + ' 天前'
       : (差 >= 3600000 ? ' · ' + Math.floor(差 / 3600000) + ' 小时前' : ' · 刚刚');
  }
  return { 文: 文 + 尾 };
}

// ══ 屏⑥ 页面 ══════════════════════════════════════════
// 用某个号的【数据仓】开腾讯页面。打样 v26。
//
// ⚠️ 这一屏的「内容」不是 HTML —— 是【另一个原生 WebView】盖在内容区上。
//    所以这里只负责两件事:① 顶栏画浏览器的壳 ② 内容区留空给它
//    面板的顶栏和底栏都还在,底栏那几个 TAB 随时能切走(这就是 v26 的全部意思)。
function 画页面屏(题, 右1, 右2, 内容) {
  var 谁 = 快照.浏览中的号;
  if (!谁) {
    题.textContent = '页面';
    内容.innerHTML =
        '<div class="card"><div class="hint">'
      + '这里用<b>某一个号的帐号信息</b>开腾讯页面,和普通浏览器一样能滑能点能缩放。<br><br>'
      + '它也是<b>验号最硬的证据</b>:页面右上角有头像 = 这个号还有效;'
      + '显示「登录」钮 = 已经失效了。<br><br>'
      + '<b>去「账号」页,点某一行的「浏览」。</b>'
      + '</div></div>'
      + '<div class="sp"></div>'
      // ⚠️ 空态【不放按钮】—— 挑号只该有一个入口(账号屏),两个入口迟早不一致
      + '<div class="card" style="border-color:var(--acc);background:var(--accbg)">'
      + '<div class="hint" style="color:var(--acc)">⚠️ 一个号一份帐号信息。'
      + '在这里登录的号<b>只进这一份</b>,和别的号互不相干。</div></div>';
    return;
  }

  画窗口条();
  // ⚠️ 待定仓【还不是一个号】—— 它不在 号们 里,所以别去查、也别叫它的 id。
  var 待定 = (快照.待定仓 && 快照.待定仓 === 谁);
  var a = 号们().filter(function (x) { return x.id === 谁; })[0] || {};

  // ⭐ A1 两行分工(2026-10-24):
  //    这一行 = 【这一页的事】(后退 / 刷新 / 这个号现在能不能用)
  //    下面那条页签 = 【哪个号的事】(切换 / 关闭)
  //    ⚠️ 号名【只出现在页签里】。原来顶栏也写一遍,是重复的。
  //    ⚠️ 「关掉」删了 —— 和页签上的 × 是同一个动作同一个目标。
  var 几时 = 多久以前(a.上次查于);
  // ⭐ 跑的时候这句话换成【跑到哪了】(打样 v28 ②)——
  //    那会儿你盯着这一屏是想知道进度,不是想知道这个号能不能用;
  //    能不能用有页签下面那条跑条 + 账号屏在管。
  // ⚠️ 登录中优先于「在跑」—— 扫码那一刻最要紧的是「等你扫码」。
  var 状 = 待定 ? ['warn', '新登录 · 等你扫码']
         : 快照.登录中 ? ['warn', '等你扫码']
         : 在跑() ? ['acc', 跑到哪了()]
         : a.页面登录态 === 'in'  ? ['ok',  '有效' + (几时 ? ' · ' + 几时 : '')]
         : a.页面登录态 === 'out' ? ['bad', '失效' + (几时 ? ' · ' + 几时 : '')]
         : ['ink3', '状态待确认'];
  题.className = 'pagebar';
  // 🔴 引擎正在这一页上发评论 -> 【不画】‹ ↻。刷一下 / 退一步,
  //    发到一半那条当场没了,而发送链不知道,只能干等 90 秒超时。
  // ⚠️ 画不画【由状态机说了算】(`快照.这页是引擎的`),界面一个字都不自己判 ——
  //    和旁边的 `快照.这页登不上` 同一条规矩(铁律 15)。
  // ⚠️ 派发那边【不再另挡一道】:钮都不画了,剩下唯一能发出 `网页后退` 的是
  //    返回键,而原生那条路自己问同一个判据(引擎服务.网页后退)。
  //    多挡一道只会变成「按了没反应」—— 那是铁律 14 栩过的坑。
  题.innerHTML =
        (快照.这页是引擎的
          ? '<span class="navlock">🔒 引擎在这页上发</span>'
          : '<span class="navbtn" data-页后退="1">‹</span>'
            + '<span class="navbtn" data-页刷新="1">↻</span>')
      + '<span style="margin-left:auto;font-size:12px;color:var(--' + 状[0] + ')">'
      + esc(状[1]) + '</span>';
  if (待定) {
    // 登到一半不想登了 —— 得给个出口,否则那个空仓会一直挂着
    右2.textContent = '不登了'; 右2.className = 'tbtn'; 右2.setAttribute('data-意图', '弃待定仓');
  } else if (快照.这页登不上) {
    // ⭐ 2026-10-24 用户要的:号登不上了,就地给个重登入口,不用绕回账号屏。
    // ⚠️ 亮不亮【由状态机说了算】(快照.这页登不上),界面一个字都不自己判 ——
    //    这里拿 a.页面登录态 === 'out' 自己算的话,刚开机那一下就会亮:
    //    那个字段是存在档案里的【历史】,页面还没看清就先说「登不上」。
    //    用户原话:「必须真的落定判定登不上再显示」。
    右2.textContent = '重新登入'; 右2.className = 'tbtn'; 右2.setAttribute('data-意图', '重新登入');
  }
  // ⚠️ 内容区必须空 —— 原生 WebView 就盖在这块上面,画什么都看不见
  内容.innerHTML = '';
}

// ⚠️ 顶栏里的 ‹ ↻ 是【标题的一部分】,不能用 data-意图(会和整行标题抢点击)。
//    单独按 x 坐标分:左边那一小段是后退,再右边一点是刷新。
// ⚠️ 2026-10-24:`‹` `↻` 以前是按【x 坐标】切出来的隐形点击区
//    (x<22 后退 / x<48 刷新)—— 没按钮样子、没按下反馈、手指偏一点就没反应,
//    用户问「这两个符号代表何意」正是因为根本看不出可点。现在是真按钮走委托。
document.getElementById('题').addEventListener('click', 派发);

// ══ 屏② 任务库 ════════════════════════════════════════
// 块序照 v18(用户 2026-09-22 定),2026-10-24 去掉「参与轮换」那一块(打样 v27 ①B):
//     列表 → 参数 → 空白 → 开始
// ⚠️ 空白永远在最后一块的上面 —— 「挤的永远是列表」那套 CSS 靠的就是这个。
function 画任务库() {
  var 任务 = 快照.任务们 || [], h = '';
  // ⭐ 2026-11-04「这一趟拍下了哪几个」搬到这张列表上来了。
  //    在这之前只有运行区那条「跑这些」说得出,而那一条和这张列表看着是重复的
  //    (用户当天指出)—— 真正重复的是【名字】,不重复的是【这一位】。
  //    搬下来之后那一条才删得掉,不然就是把信息删了。
  // ⚠️ 读的是 `这趟任务们` 不是 `勾选`:这一趟的真相是【开跑那一刻】拍下的那份,
  //    跑着时改勾选不该影响它(rotation.js 那边单测钉着)。
  // ⚠️ 2026-11-05 存的是【第几个】(1 起)而不是 true —— 右边那个标要写「排队 2」。
  //    `这趟任务们` 是按 `配置.任务ID` 的顺序给的(快照那边保证),所以下标就是次序。
  //    为什么非写号不可:顺序改成「勾的先后」之后,列表的竖直次序【不再是】跑的次序,
  //    三个「排队」标从上往下读就成了假话。号是唯一还说真话的那个东西。
  var 在趟里 = {};
  (快照.这趟任务们 || []).forEach(function (t, i) { 在趟里[t.id] = i + 1; });

  if (!任务.length) {
    h += '<div class="card"><div class="hint">还没有任务。点右上角 <b>＋ 新增</b>。<br>'
       + '一个任务 = 一部剧 + 一套节奏。<b>号不在任务里</b> —— '
       + '号在外层轮换、任务在内层(照插件的模型)。</div></div>';
  } else {
    // ⭐⭐ 2026-11-05 补这一行。账号屏编辑态上早就印着一行(当时写的是
    //    「…⠿ 按住拖 = 换顺序(列表顺序就是轮换顺序)」,当天下午 ⠿ 换成 ▲▼,
    //    那句跟着改成「右边 ▲▼ = 调顺序」),任务屏多选态【一个字都没有】——
    //    那个 ⠿ 看着没来由,正是因为屏幕上从来没有一句话说它管什么
    //    (而 11-05 之前它确实什么都不管)。
    // ⚠️ 一行写得下就别写两行:多选态底下还挂着「开始」,两行要挤列表
    //    (「挤的永远是列表」那套 CSS 的意思是它会被挤,不是它挤得起)。393 宽量过。
    if (多选中) {
      h += '<div class="hint" style="margin:0 0 5px">勾 = 这一趟跑哪几个 · '
         + '<b>勾的先后 = 跑的先后</b>(框里那个号)</div>';
    }
    h += '<div class="listwrap"><div class="list">';
    任务.forEach(function (t) {
      h += '<div class="item" data-任务="' + esc(t.id) + '">';
      // ⚠️ 勾选态下每行的「发」让位给勾 —— 一屏不该有两种开跑入口
      if (多选中) {
        // ⭐⭐ 2026-11-05 框里写【第几个跑】,不写 ✓。用户:「直接用点选顺序建立
        //    顺序不行吗」—— 行,但必须【看得见】,不然就是 ⠿ 那个老毛病换个地方犯。
        // ⚠️ `.ck2` 本来就是 16x16 / 10px / color:#fff,写个数字不用改 CSS(量过)。
        //    两位数【正好】塞得下:内容框 14px，"10" 也是 14px，不溢出(量过)。
        //    三位数挤出 1px —— 勾 100 个任务不是真场景，挤出去也只是切掉一点。
        // ⚠️ 没勾的时候画空字符串:`.ck2` 没底色时字也是白的,写什么都看不见。
        h += '<div class="ck2' + (t.勾号 ? ' on' : '') + '" data-勾任务="' + esc(t.id) + '">'
           + (t.勾号 || '') + '</div>';
      }
      // ⚠️ 名字旁边原来还挂一个「跑着」小标 —— 2026-10-24 去掉了:
      //    右边那一格已经写着「跑着」,同一行说两遍是噪音。留右边那个,
      //    因为它**占的正是「发」那个钮的位置**,必须就地说清楚为什么现在点不了。
      //    (2026-11-05:右边那个从实心蓝钮改成了纯文字 —— 见 `.st` 那段。
      //     位置没变,所以「就地解释」这条理由照样成立。)
      // ⭐ 2026-11-05 多选态下【整行】是勾的热区。⠿ 删掉之后这一行上原本只剩
      //    那个 16x16 的框点得着,其余全是死区 —— 拇指在手机上够不着 16 像素。
      // ⚠️ 不是新手势:同一个 `data-勾任务`,只是热区变大了。多选态下编辑器
      //    本来就进不去(派发那边 `改t && !多选中` 挡着),所以两边不抢。
      h += '<div style="flex:1;min-width:0" data-'
         + (多选中 ? '勾任务' : '改任务') + '="' + esc(t.id) + '">'
         + '<div class="t1">' + esc(t.名字) + '</div>'
         + '<div style="margin-top:2px">'
         + t.标签.map(function (x, i) {
             return '<span class="tag' + (i === 0 && x === '远程' ? ' acc' : '') + '">' + esc(x) + '</span>';
           }).join('')
         + (t.毛病 ? '<span class="tag bad">' + esc(t.毛病) + '</span>' : '')
         + '</div></div>';
      // 有毛病的任务点了也跑不起来,直接灰掉 —— 原因就挂在上面那个红标里,
      // 不用再弹一次 toast(UI决策.md:原因和去处在同一个地方)
      if (多选中) {
        // ⭐⭐ 2026-11-05 这一格【空着】。原来是 ⠿(按住拖 = 排顺序),用户当天删掉:
        //    「确实,任务列不应该有右边那个 ⠿,直接用点选顺序建立顺序不行吗」。
        //    顺序搬到左边勾框里(写第几个跑),这一格就没活干了。
        // ⚠️ 别顺手把「发」放回来:多选态底下有「开始」,一屏不该有两种开跑入口。
        // ⚠️ 也别放「跑着/排队」:跑着的时候【进不来多选态】(见 重绘 那一段)。
        // ⚠️ 这一支不能删,删了会落到最下面那个 else 去画一个能点的「发」。
      } else if (t.跑着) {
        /* ⭐ 正在跑的那一个。这一格【从来就不可点】(没有 data-发)——
           更早以前它还是个能点的蓝「发」,再点一次等于把这一轮从头重开。
           ⭐⭐ 2026-11-05 从 `.sm now`(实心蓝药丸)改成纯文字(打样 v47 方案 B)。
           理由写在 `.st` 那段 CSS 上:它是**状态**,不该穿钮的衣服。 */
        h += '<div class="st"><span class="dot"></span>跑着</div>';
      } else if (在跑() && 在趟里[t.id]) {
        // ⭐ 这一趟排着队、还没轮到的那几个。⚠️ 写「排队」不写灰「发」——
        //    两个都是「现在点不了」,但「排队」多说了一句【它在这一趟里】,
        //    而那正是上面那条「跑这些」被删掉之后没人再说的话。
        // ⚠️ 2026-11-05 带上号。顺序 = 勾的先后之后,列表的竖直次序不再是跑的次序,
        //    光写「排队」等于让人按位置猜 —— 那正是这一整轮要修的那个病。
        // ⚠️ 2026-11-05 跟着「跑着」一起从灰框药丸改成灰文字 —— 它也是状态,
        //    留着框就等于在一列里摆两种长得像钮、其实点不了的东西。
        h += '<div class="st wait">排队 ' + 在趟里[t.id] + '</div>';
      } else if (在跑()) {
        /* ⭐⭐ 2026-11-05 这一格【什么都不画】。用户:「『发』这个字在运行时期
           其实可以省略不显示吧?它不能在运行时发」—— 成立,而且这正是
           **「不留灰钮」**那一条:灰着、点了没反应、又不说为什么的控件,这屏上一个都不留。
           (原来画的是 `.sm off` 的「发」,理由是「别的任务也要灰掉:一次只跑一个任务,
            点下去会悄悄把当前这一轮顶掉」。那个理由没变 —— 变的是**用不画来表达**,
            而不是画一个灰的。要换任务还是得先「停止」。)
           ⚠️ **空着本身就是话**:跑着的时候这一列只给【这一趟里的】任务挂标
           (跑着 / 排队 N),没标 = 不在这一趟里。这比一个灰「发」说得更准 ——
           那个灰钮说的是「能发但现在不行」,而它真正的意思是「它根本不在这一趟里」。
           ⚠️ 整行照样点得开编辑器(`data-改任务` 在名字那一块上,不在这一格)——
           「跑着也能改」(18.11)没受影响。 */
      } else {
        h += t.毛病
          ? '<div class="sm off">发</div>'
          : '<div class="sm" data-发="' + esc(t.id) + '">发</div>';
      }
      h += '</div>';
    });
    // ⚠️ 2026-11-01 这里原来还挂着一层底边渐隐(意思是「下面还有」)。
    //    列表不自己滚了,它就是在说谎 —— 下面没有被藏起来的东西,整页往下滚就看得见。
    h += '</div></div>';
  }

  var p = 快照.参数 || {};
  // 🔴🔴 **展开时这一行和下面那三块是【一张卡】**(打样 v52 方案 D,2026-11-10)。
  //
  //    用户:「任务的参数那行点开时,看起来不像同一个区展开,
  //            所以不太明白怎么缩起来」。去量了一下 —— **不是他看错**:
  //    展开态是 `fold 行` + **三个各自带边框的 `.blk`**,而 `.body` 还有
  //    `gap:8px`,屏幕上就是**四个互不相干的盒子**,没有任何东西把它们连起来。
  //
  //    他那句其实提了两件事,分开治:
  //      ① 不像同一个区 -> `.fold.on` 去掉下圆角/下边线,三块包进 `.foldbody`
  //         贴上去、彼此只留一条细线,最后一块补回下圆角 = 标准手风琴。
  //      ② 不明白怎么缩起来 -> **把话说出来**:展开时行上垫 `--soft` 底
  //         (一看就是标题条),右边那个小小的 `▾` 换成**「收起 ▴」**。
  //
  // ⚠️ 展开时**摘要让位**给「收起」—— 内容都摊在下面了,那一刻摘要是多余的。
  // ⚠️ `.on` 是这个仓里既有的「激活态」后缀(`.ck.on` / `.runbar.on`),没新造词;
  //    「收起」复用 `.tbtn`(顶栏那两个钮的样子),也没新造。
  // ⚠️ 连起来之后**反而矮了 26px**(四条缝没了)——打样里量的 678 -> 652。
  h += '<div class="fold' + (参数开 ? ' on' : '') + '" data-意图="切参数">'
     + '<span class="k">参数</span>'
     + '<span style="flex:1;min-width:0" class="name">'
       + (参数开 ? '' : esc(参数摘要(p))) + '</span>'
     + (参数开 ? '<span class="tbtn">收起 ▴</span>'
               : '<span style="color:var(--ink3)">▸</span>')
     + '</div>';
  if (参数开) h += '<div class="foldbody">' + 画参数(p) + '</div>';

  // ⚠️ 这里原来还有一行「参与轮换」摘要(只读 + 跳转)。2026-10-24 删掉 ——
  //    用户:「参与轮换的选项太多余,因为隔壁的帐号列表就能直接编辑」。成立:
  //    这一屏你在【编任务】,底栏「账号」就在隔壁一格,那一行的 › 和它去的是同一个地方。
  //    两个入口一个意思,删了列表还能多看见一个任务(打样 v27 ①B)。
  // ⚠️ 但它原来还兼着一件事:没选号时标红「还没选号 —— 点这里去挑」,
  //    给灰掉的「开始」做解释(UI决策.md §3:「不弹窗不 toast,原因和去处在同一个地方」)。
  //    那句话搬到下面「开始」钮本身了,别再在这儿加回来。
  // ⚠️ 运行屏那一份【留着】—— 它在那边不是入口,是开跑前的最后一眼
  //    (用哪几个号 / 从谁起 / 有没有掉线),别顺手一起删(打样 v27 ③)。

  // ⭐⭐ 2026-11-01「参与轮换」这一条【跑着和停着共用这一份】,位置在参数那一块的底下。
  //    用户原话:「条到帐号那个帐号摘要区放到参数区最下面就好」。
  //    搬之前运行区自己还有一份(状态卡下面),两份长得一样、读的字段不一样 ——
  //    正是 CLAUDE.md 里记着的那个「同一个药丸两处渲染,只改了一个」(铁律 8)。
  // ⚠️ 它在这两屏上的身份【不一样】,两个都成立,所以位置也不冲突:
  //      停着 = 开跑前的最后一眼(用哪几个号 / 从谁起 / 有没有掉线)
  //      跑着 = 这一趟在用谁(只读的一眼,改轮换要去账号屏)
  // ⚠️ 必须排在 `在跑() return` 【之前】—— 跑着时这一句 return 就把下面的
  //    空白和「开始」都挡掉了,放在它后面跑着就看不见。
  h += '<div class="card" data-意图="去账号" style="display:flex;align-items:center;gap:8px">'
     + '<span style="font-size:13.5px;color:var(--ink3);flex:0 0 auto">参与轮换</span>'
     + (快照.从谁起
        ? '<span class="name" style="flex:1;min-width:0">从 ' + esc(快照.从谁起) + ' 起</span>'
          + '<span class="pill' + (快照.参与里掉线几个 ? ' bad' : '') + '" style="flex:0 0 auto">'
          + 快照.参与几个 + ' 个'
          + (快照.参与里掉线几个 ? ' · ' + 快照.参与里掉线几个 + ' 失效' : '') + '</span>'
        : '<span class="name" style="flex:1;min-width:0;color:var(--bad)">还没选号 —— 点这里去挑</span>')
     + '<span style="color:var(--ink3);flex:0 0 auto">›</span></div>';

  // ⚠️ 跑着的时候【停止】那个钮由运行区出,这儿就别再来一个 —— 一屏不该有两个
  //    同名的主钮(铁律 18.8:最大最显眼的那个得是最常用的,不是最多的)。
  if (在跑()) return h;

  h += '<div class="sp"></div>';   // 空白只长不缩,挤的永远是列表

  // ⚠️「开始」只在【多选态】出现(照 v18)。平时开跑走每行的「发」——
  //    一屏不该有两种开跑入口:非多选态下「开始」要拿哪些任务跑是说不清的。
  // ⚠️ 这里不再有 `在跑()` 那一支 —— 跑着的时候整页走 `画运行区()`,到不了这儿。
  if (多选中) {
    // ⚠️ 一个号都没参与 → 【不灰、不哑】:钮自己说原因,点了就带你去挑(打样 v27 ②B)。
    //    屏幕上不留「灰着、点了没反应、也不说为什么」的控件 ——
    //    和「退不动了必须有可见结果」是同一条规矩。
    //    (没勾任务那种不用管:勾选框就在正上方,空着是自明的。)
    if (!快照.参与几个) {
      h += '<button class="big ask" data-意图="去账号">还没选号 —— 去账号挑 ›</button>';
    } else {
      var 能 = 快照.勾了几个 > 0;
      h += '<button class="big' + (能 ? '' : ' off') + '" data-意图="' + (能 ? '开跑' : '') + '">'
         + '开始(' + 快照.勾了几个 + ' 个任务)</button>';
    }
  }
  return h;
}

function 参数摘要(p) {
  var 出 = [];
  if (p.干跑) 出.push('⚠️ 干跑');      // 排第一 —— 这条最容易忘了关
  出.push(p.轮数 ? p.轮数 + ' 轮' : '不限轮');
  if (p.每段上限分) 出.push('每段 ' + p.每段上限分 + ' 分');
  if (p.卡住上限分) 出.push('卡 ' + p.卡住上限分 + ' 分换号');
  if (p.限流就换号) 出.push('限流就换号');
  return 出.join(' · ');
}

// 参数折叠只有两个照搬插件的字段(rounds / perTaskMin)+ 一组「换号条件」
function 画参数(p) {
  return '<div class="blk">'
    + '<div class="fr"><span class="lb">共</span>'
    + '<input class="inp num" type="number" data-参数="轮数" value="' + (p.轮数 || 0) + '">'
    + '<span class="lb">轮</span>'
    + '<span class="hint">0=不限。一轮 = 参与的号各跑一遍整组任务</span></div>'
    + '<div class="fr"><span class="lb">每段上限</span>'
    + '<input class="inp num" type="number" data-参数="每段上限分" value="' + (p.每段上限分 || 0) + '">'
    + '<span class="lb">分</span>'
    + '<span class="hint">0=不限时。⚠️ 从这一段开始算,正常也会到点</span></div>'
    + '</div>'
    + '<div class="blk"><div class="bt">换号条件(满足任一个就走下一个号)</div>'
    + '<div class="fr"><span class="lb">卡住</span>'
    + '<input class="inp num" type="number" data-参数="卡住上限分" value="' + (p.卡住上限分 || 0) + '">'
    + '<span class="lb">分</span>'
    + '<span class="hint">⚠️ 从上一条发成功算起,只有出事才会到点</span></div>'
    + '<div class="fr"><span class="ck2' + (p.限流就换号 ? ' on' : '') + '" data-参数勾="限流就换号">'
    + (p.限流就换号 ? '✓' : '') + '</span><span class="lb">一撞限流就换号</span></div>'
    + '<div class="hint">⚠️ 只认<b>影子软限流</b>(ret=0 但没 feed_id)。'
    + '<code>ret=35014</code> 是<b>重复内容判重</b>,换号一点用没有 —— 该换的是评论文本。</div>'
    + '</div>'
    // ⚠️ 干跑开关:走完整条链但最后不点发布。
    //    没有它的话,第一次对着真号跑就是真跑 —— 出 bug 会直接把评论区刷脏,
    //    而且 35014 判重会把好号误判掉。调参数、换选择器之后都该先干跑一遍。
    + '<div class="blk' + (p.干跑 ? '' : '') + '" style="'
    + (p.干跑 ? 'border-color:#f0d9a8;background:var(--warnbg)' : '') + '">'
    + '<div class="fr"><span class="ck2' + (p.干跑 ? ' on' : '') + '" data-参数勾="干跑">'
    + (p.干跑 ? '✓' : '') + '</span>'
    + '<span class="lb"><b>干跑</b> —— 走完整条链,最后不点发布</span></div>'
    + '<div class="hint">换了选择器、调了参数、新号第一次上,都先开著跑一遍。'
    + '干跑照常计数照常换号,<b>只是不真发</b>。</div></div>';
}

// ══ 屏③ 任务编辑器 ════════════════════════════════════
// 字段顺序/标签/默认值【逐条对过插件 task-panel.js:392-480】(UI决策.md §3)
function 画编辑器() {
  var t = 草稿, 远程 = t.taskMode === '远程', h = '';

  // ⚠️ 远程在左、本地在右(用户 2026-10-25 定的)。**这是刻意和插件不一样的** ——
  //    插件是「本地 | 远程」(task-panel.js:436),但它的默认值又是 remote,
  //    等于把默认那个摆在第二格。我们默认也是远程,所以默认的摆左边。
  //    下次拿插件逐条对表时别把它「改回去」。
  h += '<div class="fr"><span class="lb" style="width:56px">任务模式</span>'
     + '<div class="seg"><div' + (远程 ? ' class="on"' : '') + ' data-模式="远程">远程</div>'
     + '<div' + (远程 ? '' : ' class="on"') + ' data-模式="本地">本地</div></div></div>';

  // ➕ 目标页面 —— 插件靠「你人在哪个剧集页」推断,App 没这个前提
  // ⭐ 清单来自 whitelist.json 的 dramaLinks。手敲 `mzc00200kon535w` 这种 id
  //    没人记得住,也没法核对敲错没有。
  h += '<div class="fr"><span class="lb" style="width:56px">目标页面</span>'
     + 挑一个({
         字段: '目标URL',
         项们: 快照.剧集链接 || [],
         占位: '还没选 —— 挑一个剧集',
         手填字: '自己填一个网址…',
         值的: function (d) { return d.网址; },
         画一项: function (d) {
           return '<span class="nm">' + esc(d.名) + '</span>'
                + '<span class="u">' + esc(简网址(d.网址)) + '</span>';
         },
       })
     + '</div>';
  if (远程) {
    // ⭐ 评论池下拉(用户 2026-10-25:「要参考插件,有选单」)。
    //    清单 = whitelist.json 的 `dramas` = **有评论文件的剧**,和插件同一份
    //    (task-panel.js:502)。它和上面那个 dramaLinks 不一定一样:
    //    有播放页链接 ≠ 有评论池,所以两个下拉各读各的。
    // ⚠️ 栏名叫「选评论池」不叫「选剧名」——「剧名」说不出它是干嘛的
    //    (用户 2026-10-25:「看起来不明白是评论池」)。值还是剧名,只是换了说法。
    h += '<div class="fr"><span class="lb" style="width:56px">选评论池</span>'
       + 挑一个({
           字段: 'remoteDrama',
           项们: 快照.剧名们 || [],
           占位: '还没选 —— 挑一个评论池',
           只能挑: true,   // 池必须是仓里真有的目录,手敲没有意义
           值的: function (d) { return d.名; },
           画一项: function (d) { return '<span class="nm">' + esc(d.名) + '</span>'; },
         })
       + '<div class="sm" data-意图="试连">测试连接</div></div>';
    var pv = 快照.预览;
    if (pv) {
      h += '<div class="fr"><span class="lb">评论预览</span><span style="flex:1"></span>'
         + (pv.条数 < 0 ? '<span class="pill">拉取中…</span>'
            : pv.条数 ? '<span class="pill run">拉到 ' + pv.条数 + ' 条</span>'
                      : '<span class="pill bad">' + esc(pv.错 || '一条都没有') + '</span>')
         + '</div>';
      if (pv.头几条 && pv.头几条.length) {
        h += '<div class="log">' + pv.头几条.map(esc).join('\n') + '</div>';
      }
      // ⚠️ 池小了会一直撞 35014。实测:内置 20 条时一路判重,真池 5000 条后全消失。
      if (pv.条数 > 0 && pv.条数 < 50) {
        h += '<div class="hint" style="color:var(--warn)">⚠️ 池只有 ' + pv.条数
           + ' 条,容易撞 <code>35014</code> 重复内容判重</div>';
      }
    }
    // ⭐ 远程也要能自己起名(用户 2026-10-25:「这个远程怎么没有自己填任务名的地方」)。
    //    状态机本来就支持 —— `存任务` 那边写着「用户自己填了就不动」,
    //    只是这一屏从来没把输入框画出来,等于把那条路堵死了。
    // ⚠️ 留空【不是错】,是「让它自动起名」。所以占位要把这件事说出来,
    //    不能写成「给它起个名」那种像必填的话。
    h += '<div class="fr"><span class="lb" style="width:56px">任务名</span>'
       + '<input class="inp grow" data-字段="name" placeholder="留空 = 自动起名"></div>'
       + '<div class="hint">留空就自动叫「<b>评论池名_日期 时分</b>」(照插件)。'
       + '自己填了就用你填的。</div>';
  } else {
    h += '<div class="fr"><span class="lb" style="width:56px">任务名</span>'
       + '<input class="inp grow" data-字段="name" placeholder="给它起个名"></div>'
       + '<div class="fr"><span class="lb">评论内容 —— 一条一行</span></div>'
       + '<textarea class="inp ta" data-字段="bulletList"></textarea>';
  }

  h += '<div class="fr"><span class="lb">每隔</span>'
     + '<input class="inp num" type="number" data-字段="divider">'
     + '<span class="lb">秒发一条</span>'
     + '<span class="hint">引擎再加 0~5 秒抖动 → 实际 6~11 秒</span></div>';

  h += '<div class="fr"><span class="lb">发满</span>'
     + '<input class="inp num" type="number" data-字段="targetCount">'
     + '<span class="lb">条结束</span>'
     + '<span class="hint">0=不限;<b>只算真成功</b>(拿到 feed_id);和「每段上限分」先到先算</span></div>';

  h += '<div class="fr"><span class="ck2' + (t.cooldownEnabled ? ' on' : '') + '" data-勾字段="cooldownEnabled">'
     + (t.cooldownEnabled ? '✓' : '') + '</span>'
     + '<span class="lb">启用冷却(到量/到点暂停一会,防限流)</span></div>';

  // ⚠️ 冷却关掉时【置灰】不是 hidden —— 不跳版,而且看得见自己关了什么
  h += '<div class="blk' + (t.cooldownEnabled ? '' : ' off') + '"><div class="bt">冷却</div>'
     + '<div class="fr"><span class="lb">①每发</span>'
     + '<input class="inp num" type="number" data-字段="cooldownByCount">'
     + '<span class="lb">条</span><span class="hint">0=不按条</span></div>'
     + '<div class="fr"><span class="lb">②每运行</span>'
     + '<input class="inp num" type="number" data-字段="runDuration">'
     + '<span class="lb">分</span><span class="hint">0=不按时</span></div>'
     + '<div class="fr"><span class="lb">暂停</span>'
     + '<input class="inp num" type="number" data-字段="pauseDuration">'
     + '<span class="lb">分</span></div></div>';

  // ⚠️ 限流块【不受冷却开关管】—— 照插件 blkPubLimit.hidden = !pub,只跟模式走
  h += '<div class="blk"><div class="bt warm">限流</div>'
     + '<div class="fr"><span class="lb">连续 3 次失败 → 暂停</span>'
     + '<input class="inp num" type="number" data-字段="publishLimitPauseMin">'
     + '<span class="lb">分</span></div>'
     + '<div class="hint">0=不暂停。这是<b>兜底</b> —— 先换号(4 毫秒),'
     + '一圈号都撞限流才退回暂停</div></div>';

  // ⭐ 主钮放底部(mockup v31 方案 B)。和「运行」屏那个大蓝钮「开始」同一套语言,
  //    而且拇指够得到 —— 顶栏右上角在大屏手机上是最难点的位置。
  h += '<div class="sp"></div>'
     + '<button class="big" data-意图="存任务">' + (编辑中 === 'new' ? '新增' : '保存') + '</button>';

  // 新建还没存过的任务没什么好删的,所以这一行只在【改已有任务】时出现
  if (编辑中 !== 'new') {
    h += '<div class="delrow" data-意图="删任务">删掉这个任务</div>';
  }
  return h;
}

/** 把草稿填进刚画出来的表单。⚠️ 走 value 属性不写进 HTML —— 免得引号和换行再转义一层。 */
function 填回草稿() {
  // ⚠️ 查【整个文档】不是 `#内容` —— 编辑器 2026-10-27 搬进抽屉了,
  //    抽屉和 `#内容` 是两棵树,只查 `#内容` 会一个字段都找不到(= 编辑器失忆)。
  document.querySelectorAll('[data-字段]').forEach(function (el) {
    var k = el.getAttribute('data-字段');
    el.value = (k === 'bulletList') ? (草稿.bulletList || []).join('\n')
             : (草稿[k] == null ? '' : String(草稿[k]));
  });
}

/** 把表单读回草稿 */
function 收草稿() {
  // ⚠️ 查【整个文档】不是 `#内容` —— 编辑器 2026-10-27 搬进抽屉了,
  //    抽屉和 `#内容` 是两棵树,只查 `#内容` 会一个字段都找不到(= 编辑器失忆)。
  document.querySelectorAll('[data-字段]').forEach(function (el) {
    var k = el.getAttribute('data-字段'), v = el.value;
    if (k === 'bulletList') {
      草稿.bulletList = v.split(/\r?\n/).map(function (x) { return x.trim(); })
                        .filter(function (x) { return !!x; });
    } else if (el.type === 'number') {
      草稿[k] = parseInt(v, 10) || 0;
    } else {
      草稿[k] = v.trim();
    }
  });
}

/* 日志里号名那一列要【封宽】。
   ⚠️ 等宽字体里中日韩/假名比 ASCII 宽,所以按【格】算不按字算 ——
      「我是入赘」4 个字算 8 格,「Eri (ジェリー)」13 个字算 16 格。
   ⚠️ 名字长度没上限(用户自己改的),不封的话一行给正文剩不到一半。
      封了之后最坏是截一刀,而当前号的全名在状态卡里一直写着。
   🔴 这里【按 2 倍算,而真机上是 1.67 倍】—— 2026-11-01 机上量的
      (ui-monospace:ASCII 6.0px / 中日韩 10.0px / 假名 9.97px;电脑 Chrome 才是整 2 倍)。
      ⚠️ 这个偏差是【故意往宽里算】的:算宽了只会把名字多截一刀(安卓上中文名实际
         到第 5 个字才满,我们第 5 个就截),算窄了会让那一行比预算长、挤出一行来。
         两边取宽的那个,一份代码两个平台都不会涨行。别拿真机那个 1.67 回来改这里。 */
var 号名封几格 = 9;
function 截号名(n) {
  var 格 = 0;
  for (var i = 0; i < n.length; i++) {
    格 += n.charCodeAt(i) > 0x2e80 ? 2 : 1;
    if (格 > 号名封几格) return n.slice(0, i) + '…';
  }
  return n;
}

function 日志块(额外类, 行们) {
  // ⚠️ 抽屉里那份过往日志【走同一个渲染】(一处定义,铁律 8)——
  //    不然「号名染色 / 截断 / 省掉空号名」这几条要在两处各写一遍,迟早长歪。
  var l = 行们 || (快照.日志 || []).slice(-14);
  if (!l.length) return '';
  // ⭐ 用户 2026-11-01:「运行日志中每一条都要写是哪个号发的,现在好像没有」。
  //    号是记录上的字段(rotation.js 的 记() 自动补),这儿只管画。
  // ⚠️ `<i>` 是为了把号名染个色 —— 一行里三样东西(时刻/级/号)都不染色就是一坨。
  //    用 i 不用 span:这一块每条都要带,×14 条,标签短一点。字形在 CSS 里扳回不斜体。
  // ⚠️ 号名可能是 null(这一条真的和号无关 —— 改任务库、拉剧集清单、没跑着的时候),
  //    那就【整列省掉】,不留占位空格。
  return '<div class="log' + (额外类 ? ' ' + 额外类 : '') + '" data-日志>' + l.map(function (x) {
    return 时分秒(x.时间) + '  ' + x.级 + '  '
         + (x.号名 ? '<i>' + esc(截号名(x.号名)) + '</i> ' : '')
         + esc(x.文本);
  }).join('\n') + '</div>';
}

// ══ 屏④ 账号 ══════════════════════════════════════════
// 两态:视图 / 编辑轮换。⚠️ 最左那一格【两个模式都有、同一条 CSS 20px】,切模式时名字不横跳。
function 画账号() {
  var a = 号们(), h = '';
  if (!a.length) {
    return '<div class="card"><div class="hint">还没有号。点右上角 <b>＋ 加号</b>,'
         + '会开一个真的浏览器窗口让你登录。<br>'
         + '登录本身<b>不脚本化</b> —— 微信 / QQ / 手机号 / 腾讯视频 App 扫码,你走哪条都行,'
         + '中途可以切去别的 App 再回来。</div></div>';
  }

  if (编辑轮换) {
    h += '<div class="card" style="background:var(--accbg);border-color:#cfe0ff;padding:7px 10px">'
       + '<div class="hint" style="color:var(--acc)">'
       // ⚠️ 【一行写得下】—— 量过:393 宽、可用 332px,原来那句「左边勾…右边…」346px,
       //    差 14px 折成两行。去掉「左边/右边」正好收进一行(≈300px),而那两个词本来
       //    就是废话:勾就在左边、钮就在右边,屏幕自己说得清。任务屏那句也是这个写法。
       + '勾 = 参不参与轮换 · ▲▼ = 调顺序(<b>列表顺序就是轮换顺序</b>)<br>'
       // ⚠️ 这第二行是【必须的】,不是客套:这个模式每一下都已经落盘了,
       //    「取消」在别处(任务编辑器)丢的是没存过的草稿,在这儿丢的是**已经生效的改动**。
       //    不写这句,用户会把它当成「关掉窗口」。
       + '改完点下面「完成」· 右上角「取消」= 退回刚进来的样子</div></div>';
  }

  a.forEach(function (x, i) {
    var 类 = 'prow' + (跑不了(x) || !x.参与轮换 ? ' norot' : '')
           + (x.跑着 ? ' run' : '');     // ⚠️ 读快照字段,别自己拿 当前号id 算
    h += '<div class="' + 类 + '" data-号="' + esc(x.id) + '">';

    // 最左那一格:**两个模式都有,宽度同一条 CSS(20px)** —— 切模式时名字不横跳。
    // ⚠️ 视图模式放 ▸/▾。它原来长在名字里(`.nm` 的前缀),搬出来有两个好处:
    //      ① 这一格在视图模式下不是空的 —— 空着占 20px 换「不横跳」,那是 2026-10-30
    //         否掉过的交易(头像那 30px 就是这么没的);装着 ▸ 就是**本来就要画的东西换了个位置**
    //      ② 名字行少一个会动的前缀(▸ 和 ▾ 宽度还不一样),名字起始 x 从此一动不动
    // ⚠️ `data-展开` 要跟着搬到这一格上 —— 不然点 ▸ 没反应(铁律 14:最难查的那种)。
    //    编辑模式这一格上**没有** `data-展开`,而 派发 那边还有 `!编辑轮换` 守着,两道。
    h += 编辑轮换
       ? '<div class="slot"><div class="ck' + (x.参与轮换 ? ' on' : '')
         + '" data-勾="' + esc(x.id) + '">' + (x.参与轮换 ? '✓' : '') + '</div></div>'
       : '<div class="slot tri" data-展开="' + esc(x.id) + '">'
         + (展开的 === x.id ? '▾' : '▸') + '</div>';

    h += '<div class="meta" data-展开="' + esc(x.id) + '">';
    // ⚠️ 名字要自己包一层 .nm —— 截断归它,徽章不参与(见 .name.pn 的注释)
    // ⚠️ ▸/▾ 不在这儿了 —— 2026-11-01 搬进最左那一格(见上面)。`#N` 留着:
    //    编辑模式是在排顺序,那会儿最需要看见序号,搬走就只剩「靠位置自己数」。
    h += '<div class="name pn"><span class="nm">'
       + '#' + (i + 1) + ' ' + esc(x.名字) + '</span>'
       // ⚠️ 原来这里写的是 `快照.当前号id === x.id` —— 面板自己算,漏了「还在不在跑」。
       //    停了之后 当前号id 是【刻意】留着的(运行屏要显示上一段跑的是谁),
       //    于是这个徽章就永远挂着。判据收在 rotation.js 的 跑着吗() 里(铁律 8)。
       // ⚠️⚠️ 2026-10-30 用户定的顺序,**别再打乱**:
       //    「所谓帐号的状态必须显示,是指帐号有效无效这种,能不能用,要在那让用户知道,
       //      至于运行中或任务失败,只是次要的,所以顺序上必须从重要的开始。」
       //
       //    甲类 · 这个号能不能用 —— **必须,排第一,永远恰好有一个**
       //         有效 / 失效 / 状态待确认 / 信息库破损,须重启   ← 全在 有效标() 里,互斥
       //    乙类 · 这一趟跑得怎么样 —— 次要,可有可无
       //         任务运行中 · 任务失败
       //    丙类 · 用户自己的设置 —— 次要
       //         不轮换
       //
       // 🔴 改之前「任务失败」是**长在甲类里面**的(有效标 的一个 return),
       //    于是跑挂了的号只看得到「任务失败」,**永远看不到它到底有效没有** ——
       //    而那恰恰是用户最想知道的那件事。2026-10-24 已经为它们不共用一个「词」
       //    改过一次了,这次是连**位置**也分开:两件事,两个标,甲在前。
       + (!编辑轮换 ? 有效标(x) : '')
       + (x.跑着 ? ' <span class="badge">任务运行中</span>' : '')
       + (!编辑轮换 && x.跑挂了 ? ' <span class="badge dead">任务失败</span>' : '')
       // ⚠️ 只给例外挂小标 —— 12 个号里 10 个参与时,扫 2 个灰标比扫 10 个勾快(v13)
       + (!编辑轮换 && !x.参与轮换 ? ' <span class="badge norot">不轮换</span>' : '')
       + '</div>';
    h += '<div class="rowinfo">' + 号摘要(x) + '</div></div>';

    // 编辑模式右边让给 ▲▼;视图模式才出操作钮(UI决策.md §2,从 v14 变体②)
    //
    // ⭐⭐ 2026-11-05 ⠿ 拖动【删了】,换成两个钮(照插件 content.js:1424 moveProfile)。
    //    用户:「帐号列表中用 ⠿ 冒似也容易坏掉,我觉得可以用会最简单的方式」。
    //    不是「容易坏」—— 是**一次都没成功过**。当天在模拟器上拍到三连证:
    //      ① 行确实跟着手指走(pointermove 通的)
    //      ② 松手后行【卡在半路】,还挂着 .dragging + transform = `松()` 从来没跑过
    //      ③ accounts.json 一个字节没变 = `重排` 意图从来没发出去
    //    病根:`动()` 里那句 `兄弟.after(行)` 把【正在被拖的那一行】在 DOM 里搬了家,
    //    而 pointer capture 钉在手柄那个节点上 —— 节点一搬家 capture 就作废,
    //    之后的 pointerup 落在「手指底下碰巧是谁」身上。手柄跟着行偏移走了,
    //    于是 pointerup 几乎永远落不回手柄,`松()` 不跑 -> 顺序不存、行卡住。
    //    ⚠️ 这【不是概率性不稳】:行真的跨过别人 = 一定搬家 = 一定作废;
    //       不跨的那次倒是能松手,可那一次本来就没换顺序(发出去的是原序)。两头都不成立。
    //
    // ⚠️ 用户第二句「帐号列表旁的编号不会随着顺序变化」是【同一个病的另一半】:
    //    `#N` 是渲染那一刻写死在节点里的字,行在 DOM 里搬家,字跟着搬。
    //    只有重绘才会重算它,而重绘要等快照变,快照要等 `重排` 落盘 —— 意图没发出去,
    //    就永远不重绘。换成 ▲▼ 之后这一半【自己就好了】:每按一下都是
    //    重排 -> 落盘 -> 快照变 -> 重绘 -> `#N` 重算(≤ 250ms 一拍)。别再给 `#N` 单独补逻辑。
    //
    // ⚠️ 首行禁 ▲ / 末行禁 ▼ 用的是原生 `disabled` —— 禁掉的钮连 click 都不发,
    //    所以 派发 那边收不到;那边还是又挡了一道边界,两道都留着(便宜)。
    h += 编辑轮换
        ? '<div class="reord">'
          + '<button data-上移="' + esc(x.id) + '"' + (i === 0 ? ' disabled' : '') + '>▲</button>'
          + '<button data-下移="' + esc(x.id) + '"' + (i === a.length - 1 ? ' disabled' : '') + '>▼</button>'
          + '</div>'
        : '<div class="ops">'
          // ⭐ 主操作是「浏览」—— 用这个号的仓开腾讯页面。
          //    它同时是【号有没有效】的唯一硬证据:右上角有没有那个头像。
          // ⚠️⚠️ 2026-10-29 用户:「无帐号信息的话,点浏览也不会恢复吧?
          //    此时应该要点重新登陆吧?」—— 对的。`掉线` = 罐子里没号标识 cookie,
          //    这时 `浏览`(意图 开浏览器)只会开出一个登出的腾讯页面,**救不回来**;
          //    救得回来的是 `重新登录`(意图 开登录窗,和「加号」同一条流水线)。
          //    而那个钮原来只长在明细里 —— 行上不换的话,摘要里那句指路
          //    就指着一个看不见的钮。
          // ⚠️ **空壳除外**:空壳也满足 掉线,但它这会儿登了也存不住(铁律 20),
          //    得先重启 App。给它挂「重新登录」= 骗用户去冒险,
          //    和「没备份就不画还原钮」是同一条规矩(下面那个假入口的注释)。
          //    空壳自己有红色告示说该干什么,这里不抢话。
          // ⚠️ 正在看着的号也除外 —— 那种时候「回页面」才是手边要的。
          + (x.掉线 && !x.仓空壳 && 快照.浏览中的号 !== x.id
             // ⚠️ 跑着的那个号不给这条路(理由见 画明细 里那段)——
             //    退回「浏览」,它由 `这页是引擎的` 管着,安全。
             ? (x.跑着
                ? '<button class="hot" data-浏览="' + esc(x.id) + '">回页面</button>'
                : '<button class="hot" data-重登="' + esc(x.id) + '">重新登录</button>')
             : '<button class="hot" data-浏览="' + esc(x.id) + '">'
               + (快照.浏览中的号 === x.id ? '回页面' : '浏览') + '</button>')
          + '</div>';
    h += '</div>';

    // 🔴 空壳告示【不用展开就看得见】—— 这条太要紧,藏在详情里等于没说。
    //    编辑轮换态也不挂,那一屏是在排顺序,别塞大块红字。
    if (!编辑轮换) h += 空壳告示(x);
    if (!编辑轮换 && 展开的 === x.id) h += 画明细(x);
  });

  // ⭐⭐ 2026-11-05 「完成」从右上角搬到【底下的大钮】,右上角换成「取消」。
  //    用户:「现在这个编辑轮换的画面完成不在下方,似乎跟编辑任务不太一样,
  //    可以改到下方,然后右上角加取消吗」—— 就是任务编辑器那一套(mockup v31 方案 B):
  //    **主钮在底下**(拇指够得到;大屏手机上右上角是最难点的位置),
  //    **退出路在右上角**(编辑器那个「取消」也在那儿,同样是 `.tbtn mute`)。
  // ⚠️ `.sp` 是「只长不缩」的空白:号少的时候把钮顶到屏幕最底下,号多了它自己变 0、
  //    整页滚(一个界面一个滚动容器,见 .listwrap 那段)。和任务屏「开始」同一条规则。
  if (编辑轮换) {
    h += '<div class="sp"></div>'
       + '<button class="big" data-意图="退出编辑">✓ 完成</button>';
  }
  return h;
}

/**
 * 一行摘要。⚠️ 两个证据分开说,不合并:
 *   · 帐号信息里有没有号标识 cookie —— 快,不用开窗,但【只能说明登过】
 *   · 页面右上角有没有头像 —— 慢(要开一次浏览器),但这才是【现在还有没有效】
 * 两者不一致本身就是信号:cookie 在但页面显示「登录」= 登出残留,那个号其实废了。
 *
 * ⚠️ 2026-10-29 起徽章上这两个都写「失效」(用户拍板,结果一样:都发不出评论)。
 *    **摘要行是唯一分得开它们的地方** —— 「无帐号信息」vs「失效 · 3 小时前」。
 *    所以这两段话一个字都别省,也别把它们也合并成同一句。
 */
function 号摘要(x) {
  var 出 = [];

  // ⚠️⚠️ 2026-10-31 这一行的顺序改成和【徽章】同一套:甲 -> 乙 -> 丙。
  //    那四类的定义在 画账号列表 里,别在这儿另立一套。用户当时那句
  //    「顺序上必须从重要的开始」管的不只是徽章,这一行也算。
  //    改之前是「帐号编号 -> 页面开着 -> 有效/失效 -> 任务失败 -> 今日 N 条」,
  //    甲类排在第三 —— 前面那两段一个答「这是哪个号」、一个答「窗口开没开」,
  //    都不答「这个号能不能用」。
  // 💡 顺序【不是】为了保谁不被切 —— 今天根本切不到。2026-10-31 在 预览.py 上量过:
  //    .rowinfo 是**两行夹断**(-webkit-line-clamp:2),一行 297px、两行预算 594px,
  //    而最长的那条(失效 · 3 小时前 · 任务失败(...) · 页面开着·在看 · 帐号编号 10 位·手机号登录)
  //    量下来 366px,占两行,一个字都没丢。所以这里排的就是单纯的「重要的先说」。
  //    ⚠️ 下面那段 2026-10-29 的话是【单行 ellipsis 时代】留的,那会儿真的切得到。
  //       那些数字(253px / 274px / 省下 51px)照旧有效,别因为现在切不到就把 MB 加回来;
  //       而万一哪天又收回单行,挨切的那一头已经换人了 —— 现在尾巴上是 帐号编号,
  //       它是这一行里唯一**在明细里有副本**的那段(明细的 kv('帐号编号')),切得起;
  //       原来尾巴上是「3 小时前」,那个整个 App 只有这一行说得出来,切不起。

  // ── 甲类 · 这个号能不能用 ────────────────────────
  // ⚠️ 这一类永远恰好有一句:下面两个 if 互斥 —— `掉线` 和「指纹为空」在
  //    rotation.js 里是字面上同一个条件(`a1.掉线 = !认.指纹`,2618 行)。
  //    ⚠️ 两个条件【都照原样留着】,没合并成一个。万一哪天它们走岔了,
  //       这一行顶多多说一句或少说一句,不会凭空编出一个状态来。
  // ⚠️ 这个结论是【存下来的】,可能是上次开 App 时查的 ——
  //    所以必须把「什么时候查的」一起说。不说的话用户会当成现在的状态。
  // ⚠️⚠️ 2026-10-29 用户:「但这都无帐号信息在里面了,难道不是失效吗?」—— 对的,我上一版
  //    把它当成「设计如此」说轻了。去核实过:rotation.js 里是 `a1.掉线 = !认.指纹`,
  //    **掉线 和「指纹为空」是字面上同一个条件**。开机那一瞬也对得上
  //    (账号表 load 里写死 `掉线: true`,而 指纹 不落盘 = undefined,两个一起成立)。
  //    所以 `无帐号信息` 和徽章 `失效` 说的是同一件事,一行里再打一个
  //    一天前存下来的 `有效` 就是**纯粹的错** —— 罐子里连号标识都没了,
  //    页面不可能还登着,那个 'in' 是不可能成立的旧结论。
  // -> 掉线时这一整段【不打】。不是省字,是那三句在这个前提下全都没有意义:
  //    'in' 不可能、'out' 是废话(徽章说过了)、'状态待确认' 是假的(已经确认坏了)。
  // ⚠️ 掉线为假时三句一个字都别动 —— 那边「cookie 在、页面却说登出」才是
  //    这个函数存在的理由(见上面的函数注释),和那次改的是反方向。
  if (!x.掉线) {
    var 几时 = 多久以前(x.上次查于);
    if (x.页面登录态 === 'in') 出.push('有效' + (几时 ? ' · ' + 几时 : ''));
    else if (x.页面登录态 === 'out') 出.push('失效' + (几时 ? ' · ' + 几时 : ''));
    else 出.push('状态待确认 —— 点「浏览」');
  }
  // ⚠️ 指的是「重新登录」不是「浏览」—— 罐子里没号标识 cookie,开页面只会看到登出态,
  //    救得回来的只有重登。空壳不指(它得先重启 App,红色告示在说这件事)。
  // ⚠️ 「点「浏览」」那个指路没丢 —— 在上面那个 `状态待确认` 里。
  //    新号(从没登过)走的是这一条,照样看得见该干什么。
  if (!x.指纹) 出.push(x.仓空壳 ? '无帐号信息' : '无帐号信息 —— 点「重新登录」');

  // ── 乙类 · 这一趟跑得怎么样 ─────────────────────
  // ⚠️ 徽章只有四个字,说不完「为什么失败」。原因是状态机记下来的,直接报出来。
  if (x.跑挂了) 出.push('任务失败' + (x.挂了因 ? '(' + x.挂了因 + ')' : ''));
  if (!跑不了(x) && x.今日已发) 出.push('今日 ' + x.今日已发 + ' 条');

  // ── 身份和现场 · 这是哪个号、窗口开没开 ────────────
  // 都不是「状态」:一个是身份证号,一个是此刻的现场。按「从重要的开始」排在最后,
  // 也正好让那串长度不受控的 UID 去尾巴上挨 ellipsis。
  // ⚠️ 看窗口活没活,【不是】看「现在显示的是不是它」—— 多窗之后
  //    开了 3 个窗只有 1 个在前台,其余两个照样是开着的
  if (x.窗口 === '活着') 出.push(快照.浏览中的号 === x.id ? '页面开着·在看' : '页面开着');
  // ⚠️⚠️ 2026-10-29:「帐号信息 NNMB」从这一行【撤了】,只留在明细的「信息大小」。
  //    量过:面板里这一行的可用宽度只有 253px(后来头像撤了,涨到 292px)。
  //    换成真 UID(10 位数字)之后,连最短的
  //    「帐号信息 40MB · 帐号编号 1832004571·微信登录 · 有效 · 3 小时前」
  //    都要 274px —— 而那会儿 ellipsis 吃掉的正好是尾巴上的「3 小时前」,
  //    「这个结论是什么时候查的」只有这一行说得出来,切不起。
  //    旧的 6 位哈希版要 253px,也就是【一格不剩地刚好压线】,不是险过。
  //    撤掉那段腾出 51px,UID 长短再变也还有余。
  //    ⚠️ 2026-10-31 补:这一行后来改成了两行夹断,上面这些数字是单行时代量的。
  //       结论不变:撤掉 MB 省下的 51px 照样是省下的,别又加回来(见函数开头那段)。
  // ⚠️ 空壳【不靠】这个数字发现 —— 它有自己的检测(Java 侧 池.仓cookie空壳)
  //    和自己的徽章「信息库破损,须重启」。所以撤了不会漏报。
  // ⚠️ 「帐号编号」就是 cookie 里 v_vuserid 的【原值】,也就是腾讯的 UID ——
  //    网页和网址上打的是同一串,对得上。2026-10-29 之前这里是个 6 位哈希,
  //    用户:「隐藏了反而不好辨别,可以打出来」。
  // ⚠️ 长度不受我们控制(实测微信号 10 位 —— 用户给的真值 2770239184;
  //    QQ 号还没样本)。行末有 ellipsis 兜着,完整值在明细里。
  if (x.指纹) 出.push('帐号编号 ' + x.指纹 + (x.方式 ? '·' + 方式名(x.方式) : ''));

  return esc(出.join(' · '));
}

/**
 * 名字后面那个标。**它回答的是「这个号会不会被轮到」。**
 *
 * ⚠️⚠️ 2026-10-24 改了顺序。原来是「页面态压过 cookie 态 —— 它才是真凭据」,
 *    那句话对【有没有效】是对的,但这个标在账号列表上,用户拿它判的是【能不能跑】,
 *    而那个闸是 `掉线`(体检看 cookie 罐),不是页面态 ——
 *    `能跑的号们` filter 的就是 `!a.掉线`。
 *    后果:cookie 罐空了、但上次开页面时是好的那种号,会一直挂着绿色的「能用」,
 *    轮换时却被直接跳过。用户 2026-10-24 撞到:「为何表示有 2 个号,
 *    却只有『我是入赘』这一个号在跑」—— 列表上两个号写着能用,实际只有一个跑得了。
 *    (而且原来那个顺序下,`if (x.掉线)` 这一支【根本到不了】:
 *     只要这个号历史上被页面验过一次,前两支就先返回了。)
 * ⚠️ 两个证据【都还在摘要行里】,一个都没少说(见 号摘要)。这里只是把
 *    「会不会被轮到」提到最显眼的位置。
 */
/**
 * 🔴 地基塌了:这台 WebView 不支持多数据仓。
 *
 * ⚠️ 挂在【每一屏】的最上面,不是只挂账号屏 —— 这不是某个号的问题,
 *    是整个 App 的前提没了。不说清楚的话,用户看到的是
 *    「轮换在跑,但好像一直是同一个号在发」,查不出所以然。
 * ⚠️ 这个状态下开跑会被状态机拦住(见 rotation.js 的 开跑),这里只负责说清楚。
 */
function 地基塌了条() {
  if (!快照 || !快照.多仓不支持) return '';
  return '<div class="card" style="border-color:#f0c2c0;background:var(--badbg)">'
       + '<div class="hint" style="color:var(--bad)">'
       + '🔴 <b>这台机器的 WebView 不支持多份帐号信息</b>'
       + (快照.webview版本 ? '(现在是 ' + esc(快照.webview版本) + ')' : '') + '<br>'
       + '「一个号一份帐号信息」整套都架在它上面 —— 没有它,<b>所有号会共用同一份</b>:'
       + '换号不生效、cookie 互相串。<b>开跑已经被拦住了。</b><br>'
       + '去系统的应用商店升级 <b>Android System WebView</b>(要 113 版以上)再回来。'
       + '</div></div>';
}

/**
 * 这个号这一趟发不发得出评论 —— 三个原因各自独立,界面在这一处或起来。
 *
 * ⚠️⚠️ **这是纯显示判据**(红头像 / 灰底 / 要不要显示「今日 N 条」),
 *    **不是轮换的闸**。轮换那一边是 rotation.js 的 `能跑的号们`,
 *    它只看 `参与轮换 && !掉线 && !挂了` —— 别拿这个函数去推它。
 * ⚠️ 2026-10-29 加进 `页面登录态==='out'`:既然徽章上它和 `掉线` 都写「失效」,
 *    头像就不能一个红一个灰 —— 两个号都标「失效」却长得不一样,正是看不懂的来源。
 *    (发不出评论这件事两个都成立,只是 out 要等轮到它、开窗、8 秒宽限才换号。)
 */
function 跑不了(x) { return !!x.掉线 || !!x.跑挂了 || x.页面登录态 === 'out'; }

function 有效标(x) {
  // 🔴 空壳排在最前面 —— 它比「能不能跑」还要紧:
  //    这种帐号信息你现在登得上、看着也正常,**一重启全没**(铁律 20)。
  if (x.仓空壳) return ' <span class="badge dead">信息库破损,须重启</span>';
  // ⚠️⚠️ 2026-10-29 用户拍板:`掉线` 和 `页面登录态==='out'` **共用「失效」**。
  //    理由成立 —— 对用户来说结果一样,两个都发不出评论:
  //      · 掉线           = 轮换时直接跳过(`能跑的号们` filter 的就是它)
  //      · 页面登录态 out = 轮到它时当场查头像,确认登出就换号(`等开跑登录`)
  //    ⚠️ **没有**因此把 out 变成轮换硬闸(同一天讨论过,否决了)。两个坑:
  //      ① out 只在「轮到它」时才刷新 —— 当成硬闸就再也轮不到 = 单向陷阱,
  //         只能靠手动点「浏览」救回来。现在每轮重查,页面上重登了自己就好。
  //      ② 这个结论本来就会误判(腾讯先渲染登出头),所以才有 登出宽限 + 登录态要连着。
  //         误判 out 现在只是显示问题;当成硬闸就变成「闪一下 = 永久除名」。
  if (x.掉线) return ' <span class="badge dead">失效</span>';
  // ⚠️⚠️ 「任务失败」**不在这个函数里**(2026-10-30 搬走了)。这里只回答甲类那一个问题:
  //    「这个号能不能用」。跑挂了是**这一趟**的事,帐号信息可能好端端的 ——
  //    2026-10-24 已经为它们不共用一个「词」改过一次,这次连**位置**也分开:
  //    它现在是行上一个独立的乙类徽章,排在甲类后面。
  //    放回来的话,跑挂了的号就又看不到自己到底有效没有了。
  if (x.页面登录态 === 'in')  return ' <span class="badge">有效</span>';
  if (x.页面登录态 === 'out') return ' <span class="badge dead">失效</span>';
  return ' <span class="badge norot">状态待确认</span>';
}

/**
 * 信息库破损的那条告示。⚠️ 徽章再长也说不完【该怎么办】——
 *    而这个状态下用户最容易做的事(再登一次)恰恰是白费力气。
 *    照 UI决策.md 的老规矩:原因和去处在同一个地方,不弹窗不 toast。
 */
function 空壳告示(x) {
  if (!x.仓空壳) return '';
  return '<div class="card" style="border-color:#f0c2c0;background:var(--badbg);margin-top:6px">'
       + '<div class="hint" style="color:var(--bad)">🔴 <b>这个号的信息库被清空了</b> —— '
       + '现在登得上也<b>存不住</b>,一重启就没。<br>'
       + '先<b>重启一次 App</b>(让 WebView 把库重建起来),再登这个号。</div></div>';
}

function 画明细(x) {
  var h = '<div class="detail">';
  // ⚠️ 这一行印的是 `acc_N` —— 它是【仓名】(WebView 数据仓 + cookie 备份档
  //    + 待导入落点 + 窗口的键),不是列表序号。
  // 🔴 原来叫「帐号信息」,用户 2026-11-09 读成了序号:「acc_1 这种加了顺序的
  //    会乱掉…这个是必要的吗?」—— 把一个内部名字摆在「帐号信息」这个词底下,
  //    确实像个编号。改叫「信息库名」,和徽章「信息库破损,须重启」对上。
  // ⚠️⚠️ **界面上不解释「只保证唯一、不保证连续」**(用户拍板)——
  //    那是实现细节,摆在明细里只会让人去琢磨一个本来不用管的东西。
  //    要讲就讲在开发文档里:mockup/UI决策.md「账号行怎么标」那一节 + CLAUDE.md 21.5。
  h += kv('信息库名', esc(x.id));
  // ⚠️ 帐号编号只回答「这两份帐号信息是不是同一个号」。两份同一个号【不是】串号 ——
  //    你本来就可能拿同一个号登两次。所以这里只陈述,不下判词。
  h += kv('帐号编号', x.指纹 ? esc(x.指纹) + (x.方式 ? ' · ' + 方式名(x.方式) : '') : '—(这里没有帐号信息)');
  h += kv('信息大小', MB(x.仓大小));
  h += kv('窗口', esc(x.窗口));
  var 登 = 登录时间(x.上次登录);
  if (登) h += kv('上次登录', esc(登.文));
  h += kv('今日', x.今日已发 + ' 条' + (x.今日被限流 ? ' · 被限流 ' + x.今日被限流 + ' 次' : ''));
  // ⭐ cookie 备份。⚠️ 【必须把几时备的一起写出来】——「有备份」和「备份是半小时前的」
  //    是两回事:三天前那份还原回来也是个过期的号。和 上次查于 同一条规矩。
  h += kv('信息备份', x.备份于
          ? MB(x.备份字节) + ' · ' + 多久以前(x.备份于)
          : '—(还没备过)');

  // 近 7 天:一排迷你柱 + 虚线标目标 50(2 剧 × 25)。0 的那天是灰柱。
  var 近7 = x.近7天 || [];
  if (近7.length) {
    var 目标 = 50, 顶 = Math.max(目标, Math.max.apply(null, 近7.map(function (d) { return d.条数; })));
    h += '<div class="bars"><div class="goal" style="bottom:' + (目标 / 顶 * 42) + 'px"></div>'
       + 近7.map(function (d) {
           return '<div class="bar' + (d.条数 ? '' : ' zero') + '" style="height:'
                + Math.max(2, d.条数 / 顶 * 42) + 'px"></div>';
         }).join('') + '</div>';
    h += '<div class="barx">' + 近7.map(function (d) {
           return '<span>' + d.日期.slice(5).replace('-', '/') + '</span>';
         }).join('') + '</div>';
  }

  h += '<div class="hint" style="margin-top:6px">'
     + '⚠️ <b>有帐号信息 ≠ 号还有效</b>。token 可能早失效了(插件叫这个「登出残留态」)。'
     + '要确定,点<b>浏览</b>看页面右上角有没有头像 —— 那才是硬证据。</div>';
  // ⚠️ 2026-09-25 从六个砍到三个。砍掉的三个和理由:
  //    · 看页面(放大窗口)—— 老悬浮窗路径:把窗撑成全屏只读浮层盖住整个 App。
  //      底盘有「页面」TAB 之后它既多余又危险(悬浮窗吃触摸,锁死过手机)
  //    · 预热 —— 不是账号操作,是开跑前的性能优化,而且要先勾任务,这屏没那个上下文
  //    · 改名 —— 插件压根没有。名字现在收编那一刻就从 cookie 起好了(起名/挑昵称),
  //      不会再出现「新号 N」,也就没什么好改的
  //    关窗口挪去「页面」TAB —— 窗口是那个 TAB 的东西,不是账号的属性。
  // 🔴 **引擎正站在这个号身上时,「重新登录 / 删号」两个钮不画**(2026-11-09)。
  //    它们会伤到正在跑的那一趟:删号把引擎永久卡住(当前号/在途的发送都成了悬空),
  //    重登发 `导航到` 把引擎正在发的那页开走(铁律 26「一个页面只能有一个司机」)。
  // ⚠️ **不画,不是画一个灰的**(18.10「不留灰钮」)。
  // ⚠️ 只对**这一个号**不画 —— 别的号照常全开,那正是 26 要保的
  //    (号失效了就该当场去重登)。「导出 / 还原备份 / 浏览」也照常:
  //    导出只读、还原要重启才生效、浏览由 `这页是引擎的` 管。
  // ⚠️ 状态机那头还有一道硬闸(`跑着吗` -> 记一句 + break)。两道不是冗余:
  //    这儿管「别让人看见一个会坏事的钮」,那儿管「谁绕过面板发意图都不行」,
  //    而且它会留下一句话,不是铁律 14 那种「点了没反应」。
  h += '<div class="row" style="margin-top:9px">'
     + '<button class="ghost" data-浏览="' + esc(x.id) + '">浏览</button>'
     + (x.跑着 ? '' : '<button class="ghost" data-重登="' + esc(x.id) + '">重新登录</button>')
     + '<button class="ghost" data-导出="' + esc(x.id) + '">导出</button>'
     // ⚠️ 没备份就【不画这个钮】—— 按下去只会得到一句「没有备份」,那是个假入口
     + (x.备份于 ? '<button class="ghost" data-还原="' + esc(x.id) + '">还原备份</button>' : '')
     + (x.跑着 ? '' : '<button class="ghost" data-删="' + esc(x.id) + '">删号</button>')
     + '</div>'
     + (x.跑着
        ? '<div class="hint" style="color:var(--warn);margin-top:6px">'
          + '⚠️ <b>这个号正在跑</b> —— 「重新登录」和「删号」先藏起来了:'
          + '前者会把它正在发的那页开走,后者会让这一趟卡死。'
          + '要动它,先按<b>停止</b>,或者等它换到下一个号。</div>'
        : '')
     + '<div class="hint" style="margin-top:6px">'
     + '<b>导出</b> = 把这个号的登录态存成一个 32KB 的文件(只有 cookie,不含缓存)。'
     + '重装 App、换机器都能用它把号拿回来。'
     + '⚠️ <b>那个文件就等于这个号</b> —— 别发给别人。</div>';
  if (x.备份于) h += '<div class="hint" style="margin-top:6px">'
     + '<b>还原备份</b> = 把 ' + 多久以前(x.备份于) + '那份帐号信息换回来,'
     + '号掉了可以试试。<b>⚠️ 要重启 App 才生效</b>(和导入一样 —— 跑着的 WebView '
     + '把信息库占着,这一刻盖进去会被它盖回来)。</div>';
  // ⚠️ 排了还原到重启之间,界面【必须】说得出「为什么点了没变化」,
  //    不然用户只会以为这个钮坏了。
  // ⚠️ 告示里直接放钮 —— 读完还要自己翻去设置屏找,那是在考验耐心。
  //    「原因和去处在同一个地方」,UI决策.md 的老规矩。
  if (x.排了还原) h += '<div class="card" style="border-color:var(--acc);margin-top:6px">'
     + '<div class="hint">⏳ <b>备份已经排好了</b> —— <b>重启 App</b> 之后这个号才会换成'
     + '备份里那一份。</div>'
     + '<div class="row" style="margin-top:6px">'
     + '<button class="ghost" data-意图="要重启App">现在重启</button></div></div>';
  return h + '</div>';
}

/**
 * 页面 TAB 顶上那条窗口切换条。
 *
 * ⚠️ 只有【2 个以上】窗口才显示 —— 一个窗的时候没得切,那一行是纯浪费高度。
 * ⚠️ 顺序 = 最近用过的在前(状态机排好的)。所以最右边那个永远是
 *    「窗口满了会被关掉的下一个」,用户看得见。
 * ⚠️ 正在跑的那个号带个绿点 —— 它是唯一关不掉的,得让人看出来为什么叉点不动。
 */
/**
 * 页面 TAB 的账号页签条。
 *
 * ⚠️ 2026-10-24 起【一直显示】,哪怕只开 1 个窗。
 *    原来「少于 2 个就不显示」,于是关闭入口会随窗口数在
 *    「顶栏的『关掉』」和「页签上的 ×」之间跳来跳去 ——
 *    用户问「这俩有什么不同」正是因为这个。入口永远在同一个地方。
 *
 * ⚠️ 正在跑的那个号【没有 ×】—— 它本来就关不掉(腾地方 里挡着)。
 *    给个绿点标出来,别让用户点了没反应。
 */
function 画窗口条() {
  var 条 = document.getElementById('窗口条');
  if (!条) return;
  var 窗们 = (快照 && 快照.窗口们) || [];
  if (当前页 !== '页面' || !窗们.length) { 条.className = 'tabs'; 条.innerHTML = ''; return; }
  条.className = 'tabs on';
  条.innerHTML = 窗们.map(function (w) {
    return '<span class="tab' + (w.在看 ? ' now' : '') + '" data-切窗="' + esc(w.号id) + '">'
         + (w.跑着 ? '<span class="run">跑</span>' : '')
         + esc(w.名字)
         + (w.跑着 ? '' : '<span class="x" data-关窗="' + esc(w.号id) + '">×</span>')
         + '</span>';
  // ⚠️ 这里【不显示上限】。原来写「2 / 3 窗」,用户读成了「3 个里的第 2 个」——
  //    上限是设置项,在设置屏看就够了,不该挤在这条上制造歧义。
  }).join('') + '<span class="tabsn">' + 窗们.length + ' 个窗</span>';
}

/**
 * 跑条 —— 跑的时候页面屏上那条横幅。
 *
 * ⚠️ 只在「页面」屏出现。别的屏有自己的运行信息(屏① 整屏都是),这条是给
 *    「我正看着页面,它到底在干嘛」用的。
 * ⚠️ 干跑黄 / 真发红。真发是唯一会在别人评论区留下东西的状态,
 *    不该和测试长一个样(打样 v28 ③)。
 * ⚠️ 右边那个小片是【阶段】,直接读快照的 `这条卡在` —— 那是状态机自己报的,
 *    界面不另算一份(铁律 8)。两条之间没有在途的那一条时,退回显示运行状态。
 */
function 画跑条() {
  var 条 = document.getElementById('跑条');
  if (!条) return;
  if (当前页 !== '页面' || !在跑()) { 条.className = 'runbar'; 条.innerHTML = ''; return; }
  var 干 = !!快照.干跑;
  条.className = 'runbar on ' + (干 ? 'gan' : 'real');
  条.innerHTML =
      (干 ? '⚠️ <b>干跑</b> · 模拟发送,不会真的发出去'
          : '🔴 <b>真发</b> · 发出去的是真评论')
    + '<span class="stage">' + esc(快照.这条卡在 || 快照.当前状态 || '') + '</span>';
}

function 方式名(m) {
  return m === 'wx' ? '微信登录' : m === 'qq' ? 'QQ 登录' : m === 'ph' ? '手机号登录' : m;
}

/**
 * 抽屉(打样 v38)。⚠️ 2026-11-08 起【只装一样东西:过往运行日志】。
 *
 * 编辑任务那一支搬走了 —— 它现在是 `重绘` 里 `当前页 === '任务'` 下的一页,
 * 理由见 CSS 里 `body.编辑态` 那段(抽屉的形状和手机键盘必然打架)。
 *
 * ⚠️ 它和 `内容` 是【两棵树】—— 重绘 内容 的时候抽屉不受影响,反之亦然。
 * ⚠️ `收草稿`/`填回草稿` 查的是 `document` 不是 `#内容`。编辑器搬回 `#内容`
 *    之后这一点【仍然别改】:改成只查 `#内容` 看着能跑,但哪天编辑器又挪个地方
 *    就会悄悄失忆,而且不报错。
 */
function 画抽屉() {
  var 盒 = document.getElementById('抽屉');
  if (!盒) return;
  if (!看日志) { 盒.className = ''; 盒.innerHTML = ''; return; }
  var h = '<div class="dim" data-收抽屉></div><div class="sheet">'
        + '<div class="grab"></div>';
  if (看日志) {
    var 过 = 快照.过往日志;
    h += '<div class="sheethd"><b>运行日志</b>'
       + '<span class="tbtn" data-分享日志>'
       + (快照.在凑日志 === '分享' ? '在打包…' : '分享全部') + '</span>'
       + '<span class="tbtn mute" data-收抽屉>收起</span></div>'
       + '<div class="sheetbody">';
    if (!过) {
      // 读盘那一下(三个档 + 一发 SQLite)。⚠️ 要说一句,不然看着像点了没反应。
      h += '<div class="hint">在读盘上那 ' + (快照.日志存几天 || 3) + ' 天…</div>';
    } else {
      // 日子页签。⚠️ 条数为 0 的那天也【留着不藏】—— 藏了的话用户会以为
      //    「只存了一天」;写出来「0 条」他才知道那天是真没跑。
      h += '<div class="daypick">'
         + (过.天们 || []).map(function (d, i, 全) {
             // ⚠️ 只有最近三天有现成的叫法,再往前(日志存几天 调大的话)
             //    就只能给日期 —— 「前前天」没人那么说。
             var 倒 = 全.length - 1 - i;
             var 名 = 倒 === 0 ? '今天' : (倒 === 1 ? '昨天'
                    : (倒 === 2 ? '前天' : d.日.slice(5)));
             return '<span class="' + (d.日 === 过.哪天 ? 'on' : '')
                  + (d.条数 ? '' : ' none') + '" data-看哪天="' + esc(d.日) + '">'
                  + 名 + ' · ' + 千分位(d.条数) + ' 条</span>';
           }).join('')
         + '</div>'
         + '<div class="hint" style="margin:0">⚠️ 页签只管<b>看</b>。'
         + '「分享全部」给的是<b>' + (过.存几天 || 3) + ' 天一整份</b> —— '
         + '出事常常跨午夜,只发一天我这边会看到半截。</div>';
      if (!过.共) {
        h += '<div class="hint">这一天没有日志。</div>';
      } else {
        // ⚠️ 封了就要说封了,而且要说清楚「分享的是全部」——
        //    不说的话用户会以为日志只有这 200 条、发出去也只有这些。
        if (过.共 > 过.封) {
          h += '<div class="hint" style="margin:0">这天共 <b>' + 千分位(过.共)
             + '</b> 条,下面只画最近 <b>' + 过.封
             + '</b> 条(画太多会把面板拖慢)。<b>分享发的是全部。</b></div>';
        }
        h += 日志块('past', 过.行们);
      }
      h += '<div class="hint">更早的已经自动删掉了。</div>';
    }
    h += '</div>';
  }
  // ⚠️ 2026-11-08:这儿原来还有一支 `else if (编辑中)` —— 编辑器搬去 `重绘` 当一页了。
  //    搬的时候【三头一起拆】:这一支 · 下面那句 `if (编辑中) 填回草稿()` ·
  //    上面闸口里的 `!编辑中`。只拆一头的话抽屉会在编辑时空着弹出来(一块灰蒙层
  //    盖住整页,而且点不掉)—— 那正是 CLAUDE.md 18.10 记的「只拆一头」那种事故。
  // ⚠️ 2026-11-04:这儿原来还有第三支 ——「这一轮跑这些」。
  //    连同运行区那个入口一起删了(见 画运行区)。它分两段列「这一趟 / 其他任务」,
  //    而 10-27 的 c 版已经把【完整任务列表】放回页面了,两段里的每一行
  //    页面上都点得到;唯一多说的那句「这几个在这一趟里」现在是列表里的「排队」标。
  //    ⚠️ 删的时候两头一起拆 —— 只拆一头就会留下「活着但够不着」的那一坨,
  //    那正是 2026-11-01 那次事故的形状(CLAUDE.md 18.10)。
  盒.innerHTML = h + '</div>';
  盒.className = 'on';
}

// ══ 绘 ════════════════════════════════════════════════
/* 顶栏两个钮的【出厂 class】。⚠️ 存一份在这儿,是为了不把 'tbtn mute' 这种
   字面量抄到第二个地方去(铁律 8)—— HTML 里那两个 <span> 才是定义处。 */
var 顶钮原类 = {};
['右1', '右2'].forEach(function (id) { 顶钮原类[id] = document.getElementById(id).className; });

function 重绘() {
  // ⚠️ 快照每变一次就重绘一次,而重绘会把编辑器整个重画 ——
  //    不先把表单收回草稿,用户正在打的字会被冲掉。踩过一次就够了。
  if (编辑中 && 草稿 && document.querySelector('[data-字段]')) 收草稿();
  var 内容 = document.getElementById('内容');
  var 题 = document.getElementById('题');
  var 右1 = document.getElementById('右1'), 右2 = document.getElementById('右2');
  题.className = '';          // ⚠️ 页面屏会把它设成 pagebar,别的屏要擦掉
  右1.textContent = ''; 右2.textContent = '';
  // ⚠️ 要把【所有】data-* 清掉,不能只清 data-意图。
  //    2026-09-26 栽过:顶栏右钮在「关掉」状态时挂了 data-关窗,切成「不登了」时
  //    只清了 data-意图,data-关窗 留在上面 —— 而 派发 里 找('关窗') 排在前面,
  //    结果点「不登了」实际去关了【另一个号】的窗,待定仓纹丝不动 = 看起来没反应。
  //    这类按属性委托的钮,重置就该是「清空」,不是「清我这次想得到的那个」。
  [右1, 右2].forEach(function (b) {
    [].slice.call(b.attributes)
      .filter(function (a) { return a.name.indexOf('data-') === 0; })
      .forEach(function (a) { b.removeAttribute(a.name); });
    // 🔴 2026-11-05 class 也要复位 —— 原来只清 textContent 和 data-*,
    //    于是【上一屏的样子会跟过来】:任务屏把 右1 设成 `tbtn pick on`(蓝药丸:
    //    自带底色和 padding),切到账号屏那边没人给 右1 设 class,结果右上角挂着
    //    一个**空的蓝药丸**。当天在模拟器上实拍到(账号屏「✓ 完成」左边那一坨)。
    // ⚠️ 复位放在这儿 = 一处 —— 任务屏那边原来单独写的 `右1.className='tbtn'`
    //    已经删了。再有新屏加进来,不用记得「我也要复位一下」。
    b.className = 顶钮原类[b.id];
  });

  if (!快照) {
    题.textContent = '小菇爱评论';
    内容.innerHTML = '<div class="hint">等引擎…</div>';
    return;
  }

  画窗口条();   // ⚠️ 别的屏也要叫 —— 不清掉的话切走了它还挂在那
  画跑条();     // 同上,而且它一出现/消失顶边就变,下面 报留边 跟着量
  // ⚠️ 抽屉也得跟着快照刷 —— 跑着时它里头显示的是进度,不刷就定格了。
  //    放在这儿(重绘开头)而不是结尾:它和 `内容` 互不相干,先后无所谓,
    //  但必须在 `收草稿` 之后,否则会用旧草稿把刚敲的字盖回去。
  画抽屉();
  // ⚠️ 日志封了高、自己内滚 —— 那就得每次重绘把它钉回最新那条,
  //    否则新日志进来了你还停在旧的位置,看起来像卡住了。
  setTimeout(function () {
    var lg = document.querySelector('[data-日志].run');
    if (lg) lg.scrollTop = lg.scrollHeight;
  }, 0);
  // ⚠️ 条一出现/消失,顶边厚度就变了 —— 不补报的话浏览器会被它盖住一条
  //    (报留边 自己去重,只在数字真的变了才发意图)
  if (window.报留边) setTimeout(报留边, 0);
  // ⚠️ 老的「切到屏 运行」可能还在路上(上一版 APK 的状态机 / 远程旧脚本),
  //    认一下别让它把人送到一个不存在的屏上。
  if (当前页 === '运行') 当前页 = '任务';
  // 🔴 编辑器是【任务屏下面的一页】,而编辑态里底栏是藏着的 —— 万一 当前页
  //    被别处改走了,就会出现「底栏没了、人也不在编辑器上」的死角。钉死在这儿。
  if (编辑中) 当前页 = '任务';
  document.body.classList.toggle('编辑态', !!编辑中);
  if (当前页 === '账号') {
    题.textContent = '账号 · ' + 号们().length;
    if (编辑轮换) {
      // ⚠️ 「完成」已经搬到列表底下那个大钮上了(见 画账号)。这儿是【退出路】:
      //    `tbtn mute` = 和任务编辑器抽屉头上那个「取消」同一个样子,别给它蓝色——
      //    一屏只有一个主钮,那个主钮在底下。
      右2.textContent = '取消'; 右2.className = 'tbtn mute';
      右2.setAttribute('data-意图', '取消编辑');
    } else {
      右1.textContent = '↕ 编辑轮换'; 右1.setAttribute('data-意图', '进编辑');
      右2.textContent = '＋ 加号';   右2.setAttribute('data-意图', '加号');
    }
    内容.innerHTML = 画账号();
    // ⚠️ 2026-11-05 这儿原来接着 `接拖动('拖', 'prow', '重排', '号', 8)` ——
    //    和 ⠿ 一起拆了,`接拖动` 这个函数当天也整个删掉了(没有第二个叫它的人)。
    //    ▲▼ 不用接线:它是普通的 <button>,走 `内容` 上那个 click 委托(派发)。
  } else if (当前页 === '任务') {
    // ⭐ 合屏(打样 v38):一页,按「跑没跑」换内容。
    //    编辑器不再整页替换 —— 它住进抽屉,所以顶栏/底栏/运行状态全程在。
    // ⭐ 一页,按「跑没跑」叠内容(照插件 task-panel.js:95)。
    // ⚠️ 跑着【也要有完整的任务列表和「新增」】—— 用户 2026-10-27:
    //    「这样运行时就不能运行新任务了」。所以运行区是【加在上面】,不是替掉列表。
    // 🔴🔴 2026-11-08:编辑器是这一屏下面的【一页】,不再是抽屉。
    //    ⚠️ 出口复用 `data-收抽屉` 那个 handler —— 它已经干着「先收草稿、再清
    //       编辑中/草稿/弹层、再重绘」这一整套。另开一个出口就是第二份定义
    //       (铁律 8),而这种「两个出口只改了一个」的事故本仓发生过。
    //       属性名现在是有点名不副实,留着是因为【一个把手】比好听的名字要紧。
    if (编辑中) {
      题.textContent = 编辑中 === 'new' ? '新增任务' : '编辑任务';
      右2.textContent = '取消';
      右2.className = 'tbtn mute';
      右2.setAttribute('data-收抽屉', '');
      // 🔴🔴 编辑器这一页**自己不写 `内容.innerHTML`**,把 HTML 交给 `收尾()` ——
      //    它会先和上一拍比一下,**一样就一个字节都不动**。
      //    理由见 收尾() 里那一大段:换一次 innerHTML = 焦点和键盘当场没。
      // ⚠️ 填回草稿 也归 收尾() 管(必须排在 innerHTML 那句后面,原因同上)。
      return 收尾(
        // ⚠️ 跑着也能改,但改的是【下一趟】—— 引擎读的是开跑那一刻的 `任务表` 快照,
        //    这一趟读不到。不说这句的话,用户会以为当场生效(用户 2026-10-26 拍板)。
        (在跑()
         ? '<div class="hint" style="color:var(--warn);background:var(--warnbg);'
           + 'border:1px solid var(--warnline);border-radius:8px;padding:6px 9px">'
           + '⚠️ 正在跑 —— 这里改的东西<b>这一趟不算数</b>,<b>下一趟</b>才生效。</div>'
         : '')
        + 画编辑器()
      );
    }
    题.textContent = 在跑() ? '运行中' : '任务库';
    // ⭐⭐ 2026-11-05 跑着【不进多选态】。用户:「在多选任务运行时,还可以在下方
    //    调顺序,这似乎有点矛盾? 此时应该要锁住多选这个选项吧?」成立 ——
    //    而点完「开始」人就正落在这个态里(开跑不清 `多选中`),所以非清不可。
    // ⚠️ 当天下午把 ⠿ 删了之后,这一条【理由换了但更硬】:
    //    顺序改成「勾的先后」,于是一行上会同时出现【两个号,两个意思】——
    //    左边勾框里那个是【下一趟】第几个跑,右边「排队 2」是【这一趟】第几个。
    //    并存就是请人把两个队列读成一个。两个态互斥,这个岔口根本不存在。
    //    (还有一半:多选态下 `data-改任务` 根本不发,整行让给勾了 ——
    //     而「跑着也能改」(2026-10-26 用户拍板)要的正是整行点开编辑器。两个都要整行。)
    // ⚠️ 读快照,不读那一下点击:`在跑()` 是引擎说的。点「开始」不当场清 ——
    //    开跑可能被拒(任务有毛病 / 多仓不支持),拒了人还在多选态里、「开始」还在原地。
    //    真跑起来了,下一拍快照一到这儿自己退出去(最多晚 250 毫秒)。
    // ⚠️ 退出去【不留灰钮】:顶栏那个「多选」跑着时根本不画。
    //    灰着、点了没反应、又不说为什么的控件,这屏上一个都不留。
    //    ⚠️ class 的复位 2026-11-05 下午【挪走了】—— 收进 `重绘` 开头统一做
    //       (两个顶栏钮一起复位成出厂 class)。原来在这儿单写一行 `右1.className='tbtn'`,
    //       只治了这一个岔口,账号屏那个岔口没人治 -> 右上角一个空的蓝药丸,实拍到了。
    // ⚠️ 代价说清楚:跑着没法先把【下一趟】要勾的挑出来,按一下「停止」才回来。
    //    换来的是「跑着这一屏只有一个样子」。而这一趟的队列本来就是开跑那一刻拍死的
    //    (`配置.任务ID`),勾和拖都动不了它 —— 锁掉的是一个只会骗人的控件,不是一项功能。
    // ⚠️ 这【不是】插件那种「跑着就全锁」(铁律 26 明令别抄):任务编辑器、参数、
    //    去浏览别的号,跑着照样全开。锁的只是「看起来在改这一趟队列」的那一个入口。
    if (在跑()) {
      多选中 = false;
    } else {
      var n = 快照.勾了几个 || 0;
      右1.textContent = 多选中 ? ('☑ 多选 ' + (n || '')) : '☑ 多选';
      右1.className = 'tbtn pick' + (多选中 ? ' on' : '');
      右1.setAttribute('data-意图', '切多选');
    }
    右2.textContent = '＋ 新增'; 右2.setAttribute('data-意图', '新任务');
    内容.innerHTML = (在跑() ? 画运行区() : '') + 画任务库();
    // ⚠️ 2026-11-05 这儿原来接着 `接拖动('拖任务', ...)` —— 和那个 ⠿ 一起拆了
    //    (两头一起拆:`data-拖任务` 的 render 和这条接线同时没,grep 两边都搜不着)。
    //    ⚠️ 当天下午账号屏那个 ⠿ 也换成 ▲▼ 了,于是 `接拖动` 一个叫它的人都没剩,
    //       整个函数跟着删掉(三头一起拆:render、接线、函数本体)。
    //    状态机那边 `case '任务排序'` 故意留着 —— 理由写在 rotation.js 那一支上。
  } else if (当前页 === '页面') {
    画页面屏(题, 右1, 右2, 内容);
  } else {
    画设置屏(题, 右1, 右2, 内容);
  }

  收尾();
}

/** 上一拍编辑器画出来的那份(含地基塌了那条)。null = 现在不在编辑器里。 */
var 上次编辑器 = null;

/**
 * 每一屏画完都要做的那两件事。⚠️ 抽出来是因为编辑器那一页会提前 return。
 *
 * 🔴🔴 **编辑器那一页多一条规矩:HTML 没变就一个字节都不动。**(2026-11-09 实测)
 *
 *    `内容.innerHTML = …` 是把整棵树拆了重建 —— **正在打字的那个 input
 *    连同焦点一起没**,而安卓的软键盘跟着焦点走,所以键盘当场收回去。
 *    这就是用户说的「还是无法输入」:焦点拿得到、字也打得进去,
 *    但**键盘活不过 150 毫秒**。
 *
 *    而「快照每变一次就重绘一次」,**`日志` 多一行就算变了一次** ——
 *    跑起来一秒好几行,编辑器等于永远打不了字。
 *
 *    当天抓到的那条链(模拟器实测,毫秒都对得上):
 *      键盘弹起来 -> 窗口缩(808->495)-> resize -> 报留边【强制】上报
 *      -> 状态机记一行「底盘留边 顶=120 底=0」-> 日志变 -> 快照变
 *      -> 原生推 画() -> 重绘() -> innerHTML 换掉 -> focusout -> 键盘收回去
 *    那条链的**源头**也治了(见 `addEventListener('resize', …)` 那一句),
 *    但**这一头才是通用的** —— 日志会变的理由多了去了,源头堵不完。
 *
 * ⚠️ 比的是【这次生成出来的字符串】,不是 `内容.innerHTML` 读回来的那份 ——
 *    浏览器序列化会重写引号和属性顺序,拿它比永远不相等,等于没比。
 * ⚠️ 连 `编辑中` 一起比:不然「关掉任务 A 再打开任务 B,而两份 HTML 正好一样」时
 *    会跳过重画,**B 的值填不进去**(值是 填回草稿 用 `input.value` 写的,不进 HTML)。
 * ⚠️ 跳过的那一拍【不叫 填回草稿()】—— DOM 原样留着,值本来就在里面;
 *    再填一次只会把光标位置弄没。
 */
function 收尾(编辑器体) {
  // 🔴 返回键要用的那个旗子。放这儿 = **每一屏画完都会过一次**,而且自带去重。
  //    散在各个 handler 里迟早漏一个,漏掉的症状是「返回键偶尔把 App 退了」。
  报有子页();
  var 内容 = document.getElementById('内容');
  // 🔴 地基塌了:挂在【每一屏】最上面。这不是某个号的问题,是整个 App 的前提没了。
  // ⚠️ 「页面」屏除外 —— 那一屏的内容区是给原生浏览器盖着的,画什么都看不见,
  //    而且它的高度没算进 报留边,硬挂会被浏览器压住。别的屏都看得见就够了。
  var 塌 = (当前页 !== '页面') ? 地基塌了条() : '';

  if (编辑器体 != null) {
    var 新 = 塌 + 编辑器体;
    if (上次编辑器 && 上次编辑器.id === 编辑中 && 上次编辑器.html === 新) return;
    上次编辑器 = { id: 编辑中, html: 新 };
    内容.innerHTML = 新;
    // ⚠️⚠️ 填回草稿 必须排在上面那句【后面】。`innerHTML = …` 把整棵树序列化再解析,
    //    而 `input.value` 是 JS 属性、【不进 HTML】—— 放前面的话,地基一塌,
    //    编辑器打开就是空白的,而且只在那种时候出现(最难查的那种)。
    填回草稿();
    return;
  }

  上次编辑器 = null;        // 不在编辑器里 —— 下次进来一定重画
  if (塌) 内容.innerHTML = 塌 + 内容.innerHTML;
}

// ══ 设置屏 ══════════════════════════════════════════════════════

/**
 * 设置屏开着哪个子页。'' = 最外面那一层入口列表。
 * ⚠️ 面板局部状态,**不进状态机** —— 它不是业务事实(和 `弹层开的是`/`手填的` 同一类,见 18.7)。
 */
var 设置页 = '';

/**
 * 原生推过来的版本实况。
 *
 * ⚠️⚠️ **两种形状都要认。** 1.3 及以前的 APK 推的是 `更新器.现状()` 那一句人话
 *    (`远程 v2 · 试用中`),新 APK 推 JSON。面板能远程更新、APK 不能,所以
 *    **新面板一定会落在旧原生上**,这不是过渡期,是常态。
 * ⚠️ 推不过来的字段**那一行整条不画**,不画成「—」—— 画破折号等于告诉用户
 *    「这儿坏了」,而它只是个旧包。(签到线管这叫「能力记号」。)
 */
var 版本实况 = { 脚本: '—' };

/**
 * 设置屏:一层入口 + 五个子页(打样 v48 方案 C,用户 2026-11-09 拍板)。
 *
 * **为什么切子页**:原来 10 块一条道滚下来 1547px(18.15 量的),
 * 旋钮、钮、纯说明文三种东西混排,而**整屏约八成是 `.hint`** —— 旋钮统共 2 个、钮 5 个。
 *
 * ⚠️⚠️ **打样时我自己反对过 C,理由是「分享全部」会从 1 跳变 2 跳** ——
 *    那颗钮是出事那一刻用的,18.15 专门为它把日志卡挪到第一屏。
 *    **核过之后那条理由不成立,这才敢走**:抽屉顶上本来就有一个 `data-分享日志`,
 *    而运行区的「⋯ 看更早的」直接开抽屉 —— 出事那条路是
 *    `运行屏 -> 抽屉 -> 分享`,**压根不经过设置屏**。设置里那颗是 18.15 说的
 *    「两个入口一个把手」里的**第二个**把手,埋深一层不花什么。
 *    (留着这段是因为:下次有人想把日志卡搬回设置屏第一屏时,得先看清这条路。)
 *
 * 🔴 **返回键必须一起治。** 子页从 1 个(编辑器)变成 6 个之后,
 *    硬件返回键在子页里**直接退掉整个 App** —— `主界面.收起全屏窗()` 只认
 *    「有没有借出去的全屏窗」,面板身上这一层它不知道。
 *    治法见文件末尾的 `退一层()` + `报有子页()`,顺带把编辑器那个老洞一起补了。
 */
function 画设置屏(题, 右1, 右2, 内容) {
  var 子 = null;
  for (var k = 0; k < 设置子页们.length; k++)
    if (设置子页们[k].键 === 设置页) 子 = 设置子页们[k];

  if (!子) {
    设置页 = '';              // 认不出就退回入口层 —— 别画一张白屏出来
    题.textContent = '设置';
    内容.innerHTML = 设置子页们.map(function (x) {
      var 现 = x.现状 ? x.现状() : '';
      return '<div class="entry" data-设置页="' + x.键 + '">'
           + '<span class="et">' + esc(x.名) + '</span>'
           + '<span class="ev">' + esc(现) + '</span>'
           + '<span class="ea">&rsaquo;</span></div>';
    }).join('');
    return;
  }

  题.textContent = 子.名;
  // ⚠️ 退出路走 **右2 + `tbtn mute`** —— 和编辑器、编辑轮换那两个「取消」
  //    同一个位置、同一个 class(18.8:主钮在底下,退出路在右上角)。
  //    打样图上我把「‹ 返回」画在左边,**那是错的** —— 顶栏的 h1 占着左边,
  //    两颗钮都在右边。照已有的来,别为这一页另发明一个位置。
  右2.textContent = '‹ 返回';
  右2.className = 'tbtn mute';
  右2.setAttribute('data-设置返回', '');
  内容.innerHTML = 子.画();
}

/** 入口那一行右边写什么 —— 「我那个值现在是几」,不是一句介绍 */
function 版本一行() {
  var V = 版本实况 || {};
  var 脚 = V.脚本 || '—';
  return (V.包版本名 ? V.包版本名 + ' · ' : '') + 脚;
}

var 设置子页们 = [
  // ── 运行 ──
  { 键: '运行', 名: '运行',
    现状: function () { return (快照.窗口上限 || 3) + ' 个窗'; },
    画: function () {
      var 上限 = (快照.窗口上限 || 3);
      return '<div class="card">'
        + '<div class="fr"><span class="lb">同时最多开</span>'
        // ⚠️ `inp num` 是 2026-11-09 补的:原来这两个数字框**一个 class 都没挂**
        //    (浏览器默认样子),而编辑器里的数字框一直是 `inp num` —— 同一个 App
        //    两种输入框。`.num` 本来就在(62px 居中),不是新发明的。
        + '<input class="inp num" type="number"' + 范围属性(快照.窗口上限范围)
          + ' step="1" data-参数="窗口上限" value="' + 上限 + '">'
        + '<span class="lb">个页面窗口</span></div>'
        + '<div class="hint">一个窗约 <b>250~320MB</b>,冷开要 30 秒。'
        + '满了<b>不会拦你</b> —— 自动关掉最久没碰的那个'
        + '(<b>正在跑的</b>和<b>你正看着的</b>永远不关)。<br>'
        + '改小了<b>当场生效</b>,多出来的窗立刻关掉。<br>'
        + '8GB 和 12GB 的机器扛得不一样,只有你知道该填几。</div>'
        // ⚠️ 填 1 的代价要当场说清楚 —— 不说的话用户只会觉得「换号怎么变这么慢」。
        //    预热本质上就是多开一个窗,和「只要一个窗」直接冲突(见 预热下一个)。
        + (上限 <= 1
           ? '<div class="hint" style="color:var(--warn);margin-top:6px">'
             + '⚠️ 填 <b>1</b> 就<b>不预热下一个号</b>了 —— 换号要重新冷开窗,慢 <b>~30 秒</b>。'
             + '想换号快一点就填 2。</div>'
           : '')
        + '</div>';
    } },

  // ── 帐号与备份 ──
  { 键: '帐号', 名: '帐号与备份',
    现状: function () { return '每 ' + (快照.备份每隔分 || 30) + ' 分钟'; },
    画: function () {
      return '<div class="card">'
        + '<div class="fr"><span class="lb">每隔</span>'
        // ⚠️ 2026-11-06:原来这儿是 `快照.备份每隔范围 ? …最少 : 5`(和 240)——
        //    兜底那两个数就是第二份定义,顺手一起收了。理由见 范围属性。
        + '<input class="inp num" type="number"' + 范围属性(快照.备份每隔范围) + ' step="5" '
        + 'data-参数="备份每隔分" value="' + (快照.备份每隔分 || 30) + '">'
        + '<span class="lb">分钟备份一次帐号信息</span></div>'
        + '<div class="hint">'
        + '把每个<b>还登着的</b>号的帐号信息抄一份存起来,号掉了可以在账号明细里<b>还原</b>。<br>'
        + '⚠️ <b>只备健康的</b> —— 已经失效、或者信息库坏掉的号<b>不会</b>被备份,'
        + '免得正好在号出事那一刻,把唯一能救它的那份好备份盖成废的。<br>'
        + '一份 32KB。开机检查完会立刻先备一次(刚扛过重启的那份最值钱)。<br>'
        + '⚠️ 备份和号在<b>同一台机器</b>上 —— 防的是「号掉了」,不防「手机没了」。'
        + '后者要用账号明细里的<b>导出</b>。</div></div>'
        + '<div class="card"><div class="hint">'
        + '<b>导入账号</b> = 读一个之前导出的 <code>.cookies.db</code>,把那个号装回来。<br>'
        + '⚠️ <b>选完文件要【重启 App】才生效</b> —— 跑着的窗口会把刚放进去的盖回去,'
        + '这是 WebView 的机制,绕不过。</div>'
        + '<div class="row"><button class="ghost" data-意图="导入号">导入账号</button></div></div>'
        // ⚠️ 2026-10-25 用户问「这是何意」—— 光一个钮名说不清。
        //    它最有用的场合恰恰是最不直观的那个:号【看起来还好好的】但其实已经死了。
        + '<div class="card"><div class="hint">'
        + '重新去读每个号的帐号信息,看<b>现在</b>里面是什么 —— 不开窗、不联网,只读本地。<br>'
        + '刷新:帐号编号 · 失效没 · <b>信息库坏没坏</b> · 信息大小 · 上次登录。<br>'
        + '⚠️ 什么时候用:<b>刚登完一个号</b>,或者疑心某个号不对劲。'
        + '平时只有<b>开机</b>才自动查一次 —— 中途出的事(信息库被清空最常发生在刚登完那一下)'
        + '要等下次开机才会发现,点这个就能<b>当场</b>查出来。</div>'
        + '<div class="row"><button class="ghost" data-意图="刷号">重新检查所有帐号</button></div></div>'
        // ⚠️ 这张纯说明卡**没有钮**,讲的是账号屏那颗「＋ 加号」。
        //    更该搬去账号屏(说明跟着它说明的那颗钮走),但那要动另一屏 ——
        //    这一批先放在「帐号」底下,它本来就是帐号的事。记在这儿别忘了。
        + '<div class="card"><div class="hint">'
        + '<b>加号 = 开一个真的浏览器窗口,登录不脚本化</b>(DESIGN §6)。<br>'
        + '落地 <code>v.qq.com/x/search/</code> 是为了保证那个尺寸的登录弹窗一定出得来。<br>'
        + '窗口住在这个界面里(不是悬浮窗)—— 所以你可以按 Home 切去腾讯/微信扫码,回来还在。'

/**
 * 版本信息 / 更新。照小菇爱表白那一页重做的(用户 2026-11-09:「像小菇爱表白那页一样」)。
 *
 * 🔴 **两张卡,两个版本号,刻意分开** —— 这正是表白那页重做时解决的那件事:
 *    「主程序」换版本要重装,「脚本」自己会更。混在一行里,用户永远分不清
 *    **点「检查更新」能不能让 App 从 1.3 变成 1.4**(不能)。
 *
 * ⚠️ 每一段都先问「原生推过来了吗」,没推过来就**整段不画**。理由见 `版本实况`。
 */
function 画版本页() {
  var V = 版本实况 || {};
  var h = '';

  // ── 主程序 ──
  if (V.包版本名) {
    h += '<div class="card">'
      + '<div class="vhd">主程序 <span class="vg">· 换版本要重新装一次</span></div>'
      + '<div class="vline"><span class="vn">' + esc(V.包版本名) + '</span> <span class="vg">版</span>'
      + (V.包版本号 ? ' &nbsp; <span class="vg">versionCode ' + esc(V.包版本号) + '</span>' : '')
      + '</div>'
      + (V.构建标记 ? '<div class="vline vsm vg">打包标记 ' + esc(V.构建标记) + '</div>' : '')
      // ⚠️ 比的是 versionCode 不是版本名 —— 版本名是给人看的字符串,
      //    "1.10" < "1.9" 这种比较会错。判断在原生那头做,这儿只负责画。
      + (V.新包版本名
         ? '<div class="vline vbad">⚠️ 有新版 <span class="vn">' + esc(V.新包版本名)
           + '</span><span class="vg"> 版,点下面的钮装</span></div>'
         : '')
      + '</div>'
      + (V.新包版本名
         ? '<div class="row"><button class="ghost" data-意图="装新包">'
           + esc(V.下载中 || '下载并安装新版') + '</button></div>'
         : '');
  }

  // ── 脚本(层 2)──
  h += '<div class="card">'
    + '<div class="vhd">脚本 <span class="vg">· 联网更新下来的,换版本不用重装</span></div>';
  var 脚 = String(V.脚本 || '—');
  var 内置 = 脚.indexOf('内置版') === 0;
  // 现状() 吐的是「远程 v2 · 试用中 · 拉黑过 1」—— 第一段是版本,后面是旗子。
  var 段 = 脚.split(' · ');
  h += '<div class="vline"><span class="vn">' + esc(段[0]) + '</span>'
     + (内置 ? '<span class="vg"> 那一份</span>' : ' <span class="vg">版</span>')
     + (段.indexOf('试用中') >= 0 ? ' <span class="pill warn">试用中</span>' : '')
     + '</div>';
  if (内置) {
    // ⚠️ 这一支是**新装的人第一次打开会看到的**,话要说完:
    //    ① 现在跑的是装包时带的那份(诚实)② **不用他做任何事** —— 更新器自己会拉。
    //    不写②的话,用户会以为必须自己去点那颗钮。
    // ⚠️ 这儿**不要**摆一条红色警告(「网上多半已经有更新的了」):装好之后
    //    更新器已经自己查过一次,拿警告去提醒一件已经处理掉的事,
    //    只会跟下一句「不用你点什么」自相矛盾。(表白那页写过两版才定下来。)
    h += '<div class="vline vg">新版会自己拉,<b>不用你点什么</b>;拉到之后<b>下次启动</b>就换上。</div>';
  }
  if (V.上次查于) {
    h += '<div class="vline"><span class="vg">上次检查于 </span>'
       + '<span class="vt">' + esc(V.上次查于) + '</span>'
       + (V.多久之前 ? '<span class="vg"> (' + esc(V.多久之前) + ')</span>' : '')
       + '</div>';
    if (V.上次结果) h += '<div class="vline vg">结果:' + esc(V.上次结果) + '</div>';
  } else if (V.上次查于 === '') {
    // 原生明确说了「没查过」—— 和「这个字段根本没推过来」不是一回事
    h += '<div class="vline vg">还没查过更新</div>';
  }
  for (var m = 0; m < 段.length; m++) {
    if (段[m].indexOf('拉黑过') === 0)
      h += '<div class="vline vsm vbad">⚠️ ' + esc(段[m])
         + ' —— 那一版连着两次没跑稳,已经自己退回去了</div>';
  }
  h += '</div>';

  h += '<button class="big" data-意图="查更新">检查更新</button>';
  // ⚠️ 「回到内置版」是出事时的退路,一个月点不到一次 —— 所以是 ghost 不是 big(18.8)。
  //    已经在内置版上了就**画成灰的**:它不是「不能点」,是点了什么都不会发生。
  h += '<div class="row"><button class="ghost"' + (内置 ? ' disabled style="opacity:.35"' : '')
     + ' data-意图="回到内置版">回到内置版</button></div>';

  if (段.indexOf('试用中') >= 0) {
    // 🔴 「试用中」这个词现在就印在界面上,而一个字的解释都没有 ——
    //    用户看到只会慌,**而它恰恰是一切正常**。只在真出现时画。
    h += '<div class="banner"><b>「试用中」是什么意思:</b>这一版刚换上、还没确认跑得稳。'
       + '连着两次开机都没跑稳,它会<b>自己</b>被拉黑并退回内置版 —— 你不用做任何事。</div>';
  }

  h += '<div class="card"><div class="hint">'
    + '拉下来的<b>不当场用</b> —— 后台下、<b>下次启动生效</b>。跑到一半换脚本等于换了个状态机。<br>'
    + '三道防线:<code>sha256</code>(只查下载有没有截断)→ <b>语法预检</b>(编不过一行都不执行)'
    + '→ <b>启动看门狗</b>(连着两次没确认稳定就拉黑那一版、退回内置)。<br>'
    + '⚠️ 仓有 <b>5 分钟 CDN 缓存</b>,推完之后最多要等 5 分钟才查得到。'
    + '</div></div>';

  // ⚠️ 报障那一行是 v48 新加的。在这之前要问用户「你跑的是哪一版」,
  //    他得截三个地方;这一行一次给全。拿不到的字段自己会缺席,不留占位符。
  var 牌 = ['com.jer.qqcomment'];
  if (V.包版本名) 牌.push(V.包版本名 + (V.包版本号 ? '(' + V.包版本号 + ')' : ''));
  牌.push(脚);
  if (V.构建标记) 牌.push(V.构建标记);
  h += '<div class="hint">报障时连这行一起截 ——<br><span class="vg">' + esc(牌.join(' · ')) + '</span></div>';

  return h;
}
