// ⚠️ 全部走事件委托 + data-* —— 不写 inline onclick(引号多转义一层,写错整个脚本都不跑)
document.getElementById('底栏').addEventListener('click', function (ev) {
  var d = ev.target.closest('[data-页]');
  if (!d) return;
  var 旧页 = 当前页;
  当前页 = d.dataset.页;
  编辑轮换 = false; 展开的 = null;
  // ⚠️ 浏览器是【原生 WebView 盖在内容区上】,切走了要主动叫它藏起来 ——
  //    不然它会一直浮在别的屏上面。切回来再显示,窗口始终不关(v26 第 3 条)。
  if (旧页 === '页面' && 当前页 !== '页面') 发意图('藏浏览器');
  // ⚠️ 这里原来还卡一个 `&& 快照.浏览中的号` —— 于是【跑着的时候切进来什么也不发】,
  //    因为跑和浏览是两套:跑的时候 浏览中 是 null,看到的就是空态。
  //    2026-10-24 拿掉那个条件:号id 可以是空,由状态机去挑(跑着就挑正在跑的那个)。
  //    挑谁是【决策】,归 rotation.js,面板不自己算(铁律 15)。
  //    ⚠️ 停着又没浏览过谁时,状态机那边 当前号 也是 null,开浏览器 开头就 return —— 安全。
  if (当前页 === '页面' && 旧页 !== '页面' && 快照) {
    发意图('开浏览器', { 号id: 快照.浏览中的号 || '' });
  }
  [].forEach.call(this.children, function (c) {
    c.classList.toggle('on', c.dataset.页 === 当前页);
  });
  重绘();
});

document.querySelector('.top').addEventListener('click', 派发);
document.getElementById('内容').addEventListener('click', 派发);
// ⚠️ 抽屉是 `#内容` 的兄弟,不挂上它里面的钮一个都不响应(编辑器就在里面)。
document.getElementById('抽屉').addEventListener('click', 派发);
document.getElementById('窗口条').addEventListener('click', 派发);   // 片和叉都走同一套委托

function 派发(ev) {
  var t = ev.target;
  var 找 = function (k) { var e = t.closest('[data-' + k + ']'); return e && e.getAttribute('data-' + k); };

  var 勾 = 找('勾');
  if (勾) {
    var 号 = 号们().filter(function (x) { return x.id === 勾; })[0];
    发意图('改轮换', { 号id: 勾, 参与: !(号 && 号.参与轮换) });
    return;
  }
  // ⭐ 换轮换顺序(2026-11-05 从 ⠿ 拖动换过来,照插件 moveProfile)。
  // ⚠️ 【复用 `重排`】,没新开意图 —— 面板自己把换好的整个顺序算出来发过去。
  //    新意图名本身不要 Java 加 case(default 原样转发),但复用这个还有两个好处:
  //    状态机那一支和它的单测一个字都不用动,而「前端漏报一个就补在后面」那条兜底白送。
  // ⚠️ 顺序从【快照】里取,不从 DOM 里数 —— 屏幕上那几行就是快照画出来的,
  //    从 DOM 数等于把渲染结果再反解析一遍(⠿ 那套就是这么干的,顺手把自己坑了)。
  var 上挪 = 找('上移'), 下挪 = 找('下移');
  if (上挪 || 下挪) {
    var 序 = 号们().map(function (x) { return x.id; });
    var 甲 = 序.indexOf(上挪 || 下挪), 乙 = 甲 + (上挪 ? -1 : 1);
    if (甲 < 0 || 乙 < 0 || 乙 >= 序.length) return;   // 头/尾:钮本来就禁着,这是第二道
    var 换手 = 序[甲]; 序[甲] = 序[乙]; 序[乙] = 换手;
    发意图('重排', { 顺序: 序 });
    return;
  }
  var 删 = 找('删');
  if (删) { if (confirm('删掉这个号?它的帐号信息(登录态)也会一起删掉。')) 发意图('删号', { 号id: 删 }); return; }
  // ⚠️ 切屏统一由状态机发「切到屏」—— 面板不自己抢,否则两处各切一次会打架
  // ⚠️ 关窗要排在切窗【前面】—— 那个叉是片的子元素,顺序反了点叉会被当成切窗
  if (找('页后退')) { 发意图('网页后退'); return; }
  if (找('页刷新')) { 发意图('网页刷新'); return; }
  var 导出 = 找('导出'); if (导出) { 发意图('导出号', { 号id: 导出 }); return; }
  // ⭐ 还原备份。⚠️ 要先问 —— 这是【拿旧的盖掉现在的】,盖错了现在这份就没了。
  //    ⚠️ 意图名直接就是事件名,Java 那边不用加 case(default 原样转给状态机)。

  var 还原 = 找('还原');
  if (还原) {
    if (confirm('把备份里那份帐号信息换回来?现在这一份会被盖掉。\n⚠️ 要重启 App 才生效。'))
      发意图('要还原备份', { 号id: 还原 });
    return;
  }
  var 关窗片 = 找('关窗'); if (关窗片) { 发意图('关窗口', { 号id: 关窗片 }); return; }
  var 切窗 = 找('切窗');  if (切窗)  { 发意图('切窗口', { 号id: 切窗 }); return; }
  var 浏览 = 找('浏览'); if (浏览) { 发意图('开浏览器', { 号id: 浏览 }); return; }
  var 重登 = 找('重登'); if (重登) { 发意图('开登录窗', { 号id: 重登 }); return; }
  var 关窗 = 找('关窗'); if (关窗) { 发意图('关窗口', { 号id: 关窗 }); return; }
  var 预热 = 找('预热'); if (预热) { 发意图('预热', { 号id: 预热 }); return; }

  var 展 = 找('展开');
  if (展 && !编辑轮换) { 展开的 = (展开的 === 展) ? null : 展; 重绘(); return; }

  // ── 屏② ──
  var 勾t = 找('勾任务');
  if (勾t) {
    var tt = (快照.任务们 || []).filter(function (x) { return x.id === 勾t; })[0];
    // ⚠️ 2026-11-05 读 `勾号`(0 = 没勾),快照里那个 `勾了` 换掉了
    发意图('勾任务', { id: 勾t, 勾: !(tt && tt.勾号) });
    return;
  }
  var 改t = 找('改任务');
  // ⚠️ 跑着时也放行(用户 2026-10-26:「跑着也能改、下一趟生效」)——
  //    入口是「跑这些」抽屉里的那几行。多选态下不放行:那时整行是用来勾的。
  if (改t && !多选中) { 开编辑器(改t); return; }
  var 发t = 找('发');
  if (发t) { 发意图('开跑', { 任务id: 发t }); return; }

  // ── 屏③ ──
  var 模式 = 找('模式');
  if (模式) { 收草稿(); 草稿.taskMode = 模式; 重绘(); return; }
  // ── 设置屏的子页(打样 v48 方案 C)──
  // ⚠️ 用 closest 不用 ev.target:入口那一行里有三个 span(名字 / 现状 / ›),
  //    点中哪一个都该算点了这一行。
  var 进设置 = ev.target.closest('[data-设置页]');
  if (进设置) { 设置页 = 进设置.dataset.设置页; 重绘(); return; }
  if (ev.target.closest('[data-设置返回]')) { 设置页 = ''; 重绘(); return; }

  // ⭐ 抽屉(打样 v38)
  if (ev.target.closest('[data-收抽屉]')) {
    // ⚠️ 收之前先把表单收回草稿 —— 不然用户刚敲的字随抽屉一起没了。
    //    (「取消」本来就该丢弃,但 `弃编辑` 那条路会走到这儿之后才清,顺序不能反。)
    if (编辑中 && 草稿 && document.querySelector('[data-字段]')) 收草稿();
    // ⚠️ 看日志 收起时要把【远端那份】也清掉 —— 那 200 条待在快照里的话,
    //    快照每 250 毫秒就要多 stringify 一遍。看一眼的代价不该是永久的。
    if (看日志) 发意图('收过往日志');
    编辑中 = null; 草稿 = null; 看日志 = false;
    弹层开的是 = null; 手填的 = {};
    画抽屉(); 重绘(); return;
  }
  // ⚠️ `data-看这趟` 那个 handler 2026-11-04 删了 —— 连入口带抽屉一起拆的。

  // ⭐ 过往运行日志(打样 v45)。
  // ⚠️ 一个入口两个门把(铁律 18.11):设置屏那张卡 + 运行区那条「看更早的」,
  //    两处都发 `data-看日志`,只有这一处处理。
  // ⚠️ 先开抽屉再发意图 —— 读盘要几拍回话,先开着能看见「在读盘上那 3 天…」,
  //    反过来会是「按了半秒没反应,然后突然弹一个抽屉」。
  if (ev.target.closest('[data-看日志]')) {
    看日志 = true; 画抽屉();
    发意图('看过往日志');
    return;
  }
  var 看哪天 = 找('看哪天');
  if (看哪天) { 发意图('看过往日志', { 哪天: 看哪天 }); return; }
  // ⚠️ 版本信息【不在快照里】(更新器刻意住在层 1),所以由这儿带过去 ——
  //    查问题时「他跑的是哪一版脚本」是最该知道的一件事。
  if (ev.target.closest('[data-分享日志]')) {
    发意图('分享日志', { 版本: 版本信息 });
    return;
  }

  // ⭐ 「挑一个」控件(目标页面 / 选评论池 共用,mockup v30 方案 D1)
  var 开的 = 找('挑开');
  if (开的) {
    // 清单是空的(拉失败/还没回来)—— 这一下是「重试」,不是「展开」。
    // ⚠️ 带 强制,绕过状态机那边 5 分钟的保鲜,不然这个钮点了也没反应。
    if (ev.target.closest('[data-挑空]')) { 发意图('要剧集链接', { 强制: true }); return; }
    弹层开的是 = (弹层开的是 === 开的) ? null : 开的; 重绘(); return;
  }
  var 手填了 = 找('挑手填');
  if (手填了) { 手填的[手填了] = true;  弹层开的是 = null; 重绘(); return; }
  var 回去了 = 找('挑回');
  if (回去了) { 手填的[回去了] = false; 弹层开的是 = null; 重绘(); return; }
  var 挑中了 = 找('挑中');
  if (挑中了) {
    var 给谁 = 找('挑给');
    // ⚠️⚠️ 【写那个框,不写草稿】—— `重绘()` 开头自己又叫一次 `收草稿()`,
    //    写草稿会被那一下读回来的框盖掉(铁律 18.6)。触发器模式下那个框是 hidden,
    //    但照样是 `[data-字段]`,所以这里只有一条路、没有特例。
    var 框 = 给谁 && document.querySelector('[data-字段="' + 给谁 + '"]');
    if (框) 框.value = 挑中了;
    if (给谁) 手填的[给谁] = false;
    弹层开的是 = null;
    重绘();                       // 重绘 自己会 收草稿,把刚写进去的收走
    return;
  }
  var 勾字 = 找('勾字段');
  if (勾字) { 收草稿(); 草稿[勾字] = !草稿[勾字]; 重绘(); return; }

  var i = 找('意图');
  if (!i) return;
  if (i === '进编辑') {
    编辑轮换 = true; 展开的 = null;
    // ⭐ 拍底片 —— 「取消」要靠它倒回去(为什么需要:见 轮换原样 的声明)
    轮换原样 = 号们().map(function (x) { return { id: x.id, 参与: !!x.参与轮换 }; });
    重绘();
  }
  else if (i === '退出编辑') { 编辑轮换 = false; 重绘(); }
  // ⭐⭐ 真的取消 —— 把进来那一刻的顺序和勾原样发回去。
  // ⚠️ 复用现成的两个意图(`重排` / `改轮换`),没新开 —— 新意图名要在 Java 的
  //    switch 里加一行 = 层 1 = 逼用户重装 APK(和「重新登入」那条同一个理由)。
  // ⚠️ 变了才发:没改过就只是关掉模式,不去白写一遍盘。
  // ⚠️ 顺序先发、勾后发:两个互不相干(`改轮换` 按 id 找),这么排只是好读。
  // ⚠️ 底片里的号可能已经不在了(编辑途中被引擎删掉/加进来):
  //    `重排` 那边没点名的会补在后面、不认识的会忽略,`改轮换` 找不到就跳过。两边都兜得住。
  else if (i === '取消编辑') {
    var 底片 = 轮换原样 || [];
    var 现在的 = 号们();
    var 现序 = 现在的.map(function (x) { return x.id; }).join();
    var 原序 = 底片.map(function (x) { return x.id; }).join();
    if (原序 && 原序 !== 现序) 发意图('重排', { 顺序: 底片.map(function (x) { return x.id; }) });
    底片.forEach(function (旧) {
      var 今 = 现在的.filter(function (x) { return x.id === 旧.id; })[0];
      if (今 && !!今.参与轮换 !== 旧.参与) 发意图('改轮换', { 号id: 旧.id, 参与: 旧.参与 });
    });
    编辑轮换 = false; 重绘();
  }
  else if (i === '加号')     发意图('加号');   // ⚠️ 切屏由状态机发「切到屏」,这里不抢
  else if (i === '弃待定仓') 发意图('弃待定仓');
  // ⚠️ 要问一次 —— 点下去 App 真的会关掉,没问过的话那是个惊吓不是功能。
  // ⚠️⚠️ 这一条【必须在 `var i = 找('意图')` 后面】。第一版放在前面 ——
  //    `var` 提升,i 是 undefined,比较永远不成立,**点了一点反应都没有、也不报错**。
  else if (i === '要重启App') {
    if (confirm((在跑() ? '正在跑,重启会把这一趟断掉。' + 跳行() : '')
                + '要重启 App 吗?会先把 cookie 刷到盘上再关,关掉之后自己回来。'))
      发意图('要重启App');
  }
  // ⭐ 页面屏右上角的「重新登入」。发的是【已有的】`开登录窗` ——
  //    加号和重登本来就是同一条流水线(引擎服务.收意图 的注释写着)。
  //    为它另开一个意图 = 在 Java 的 switch 里加一行 = 层 1 = 逼用户重装 APK。
  // ⚠️ 再挡一次 `这页登不上`:快照可能慢一拍,别在「刚翻成能用」那一瞬被点中。
  else if (i === '重新登入') {
    if (!快照 || !快照.这页登不上 || !快照.浏览中的号) return;
    发意图('开登录窗', { 号id: 快照.浏览中的号 });
  }  // ⚠️ 这里以前顺手开了 编辑轮换 —— 那个模式下卡片变成勾选框+拖动柄,
  //    「浏览」钮根本不渲染。等于把用户送到一个【挑不了号】的地方。
  else if (i === '去账号')   { 当前页 = '账号'; 编辑轮换 = false; 换底栏('账号'); 重绘(); }
  else if (i === '开跑')     发意图('开跑');
  else if (i === '停')       发意图('停');
  // ⚠️ 两个意图名【状态机那边一字不差】—— Java 不认识它们,
  //    走 `收意图` 的 default 原样转发(所以这整件事是层 2,能远程更新)。
  else if (i === '暂停')     发意图('暂停');
  else if (i === '继续')     发意图('继续');
  else if (i === '立刻重试')  发意图('立刻重试');
  else if (i === '跳过当前号') 发意图('跳过当前号');
  else if (i === '刷号')     发意图('刷号');
  else if (i === '导入号')   发意图('导入号');
  else if (i === '收浏览器') { 发意图('收浏览器'); 重绘(); }
  else if (i === '查更新')   发意图('查更新');
  else if (i === '回到内置版') {
    if (confirm('回到 APK 内置的那一版脚本?重启之后生效。')) 发意图('回到内置版');
  }
  else if (i === '改名') {
    // 微信/手机号登录拿不到昵称,「新号 1」得能改掉
    var 谁 = 号们().filter(function (x) { return x.id === 展开的; })[0];
    var 新名 = prompt('给这个号起个名', 谁 ? 谁.名字 : '');
    if (新名 != null && 新名.trim()) 发意图('改名', { 号id: 展开的, 名字: 新名 });
  }
  else if (i === '切多选')   { 多选中 = !多选中; if (!多选中) 发意图('清空勾选'); 重绘(); }
  else if (i === '切参数')   { 参数开 = !参数开; 重绘(); }
  else if (i === '新任务')   开编辑器('new');
  else if (i === '弃编辑')   { 编辑中 = null; 草稿 = null; 弹层开的是 = null; 手填的 = {};
                              画抽屉(); 重绘(); }
  else if (i === '试连')     { 收草稿(); 发意图('试连', { 剧名: 草稿.remoteDrama }); }
  else if (i === '存任务') {
    收草稿();
    发意图('存任务', { id: 编辑中 === 'new' ? null : 编辑中, 任务: 草稿 });
    编辑中 = null; 草稿 = null; 画抽屉(); 重绘();
  } else if (i === '删任务') {
    if (confirm('删掉这个任务?')) {
      发意图('删任务', { id: 编辑中 });
      编辑中 = null; 草稿 = null; 画抽屉(); 重绘();
    }
  }
}

/** 进编辑器。'new' = 新建一份默认草稿;否则拷一份现有的(改坏了「取消」还能退回去)。 */
function 开编辑器(id) {
  var 库 = (快照 && 快照.任务库) || {};
  编辑中 = id;
  // 🔴 新任务的默认值【只有一处定义】:rotation.js 的 `空任务()`,经快照 `任务默认` 送过来。
  //    2026-11-05 之前这儿照抄了一份 —— 两份当时逐字一致,但那正是铁律 8 说的形状
  //    (「两处定义同一件事,迟早对不上」)。**改默认值从此只动 rotation.js。**
  // ⚠️ 拿不到就给空的,**不在这儿补一份兜底值** —— 补了就又是第二份定义。
  //    空的后果只是表单那几个数字框是空的;存的时候 `存任务` 会
  //    `Object.assign(空任务(), …)` 填齐,所以**存下来的永远是引擎那一份**。
  //    (什么时候会拿不到:`资源.java` 的「退回内置」是**按文件**的,远程新面板配上
  //     内置的旧 rotation.js 就可能没这个字段 —— 铁律 10 那条「推完 js 记得重打 APK」
  //     说的就是这个窗口。)
  草稿 = (id === 'new' || !库[id])
    ? JSON.parse(JSON.stringify((快照 && 快照.任务默认) || {}))
    : JSON.parse(JSON.stringify(库[id]));
  // ⭐ 顺手要一次剧集直通链(「目标页面」那个下拉要用)。
  // ⚠️ 节流在状态机那边(5 分钟保鲜)—— 面板只管开口要,别自己再记一份时间,
  //    两处各记迟早对不上。
  弹层开的是 = null; 手填的 = {};
  // ⚠️ 一个抽屉只装一样东西。这儿原来关的是「这一轮跑这些」(2026-11-04 删了),
  //    现在关的是运行日志 —— 而且【比原来更要紧】:画抽屉 里 `看日志` 排在
  //    `编辑中` 前面,不关掉的话开编辑器会看见日志,编辑器整个出不来。
  看日志 = false;
  发意图('要剧集链接');
  画抽屉();        // ⚠️ 编辑器住抽屉里,只 重绘 是打不开它的
  重绘();
}

// 参数是【改一下就存】,没有保存钮(和账号那边的顺序一样,照插件 moveProfile)
// 点别处收起 ▼ 那个弹层。
// ⚠️ 挂 document 而不是 #内容 —— 点顶栏/底栏也该收起来。
// ⚠️ 要放过【钮自己和弹层里的项】:它们由 派发 处理,这里再 重绘 一次会把那次点击作废。
//    事件先到 派发(#内容)再冒泡到这里,所以 派发 已经处理完了,这里只管收尾。
document.addEventListener('click', function (ev) {
  if (弹层开的是 === null) return;
  // ⚠️ 要放过【控件自己的那几个钮】:事件先到 派发(#内容)再冒泡到这里,
  //    不放过的话 派发 刚处理完的那次点击会被这里的 重绘 作废 = 点了没反应。
  if (ev.target.closest('[data-挑开],[data-挑中],[data-挑手填],[data-挑回]')) return;
  弹层开的是 = null; 重绘();
});

// ⚠️ 同样要给抽屉挂一份 —— 编辑器里的下拉/数字框都在抽屉里。
['内容', '抽屉'].forEach(function (id) {
document.getElementById(id).addEventListener('change', function (ev) {
  // ⭐ 从剧集直通链里挑了一个 → 填进「目标页面」。
  // ⚠️ 挂 change 不是 click —— <select> 点开时就 click 了,那时候还没选。
  // ⚠️ 先 收草稿 再覆盖:同屏别的输入框里刚敲的字,不先收就会被这次重绘吃掉。
  // ⚠️ 挑回「从剧集直通链里挑…」(空值)【不清空】目标页面 —— 那是误触,
  //    把用户刚填的网址抹掉毫无道理。
  var 链el = ev.target.closest('[data-挑链]');
  if (链el) {
    if (链el.value) {
      // ⚠️⚠️ 【写表单,不写草稿】。第一版写的是 `收草稿(); 草稿.目标URL = …; 重绘();`
      //    —— 不管用,而且一声不响:`重绘()` 开头【自己又叫一次 收草稿()】,
      //    把那个还空着的输入框读回来,正好盖掉刚赋的值。
      //    旁边 `data-勾字段` 那条「收草稿 → 改草稿 → 重绘」能用,是因为勾选项
      //    【不是】 `[data-字段]` 输入框,收草稿 根本不碰它。别照抄那一条。
      var 目标el = document.querySelector('[data-字段="目标URL"]');
      if (目标el) 目标el.value = 链el.value;
      重绘();                     // 重绘 自己会 收草稿,把刚写进表单的收走
    }
    return;
  }
  var p = ev.target.closest('[data-参数]');
  if (!p) return;
  var 改 = {};
  改[p.getAttribute('data-参数')] = parseInt(p.value, 10) || 0;
  发意图('改参数', { 参数: 改 });
});
});
document.getElementById('内容').addEventListener('click', function (ev) {
  var g = ev.target.closest('[data-参数勾]');
  if (!g) return;
  var k = g.getAttribute('data-参数勾'), 改 = {};
  改[k] = !((快照.参数 || {})[k]);
  发意图('改参数', { 参数: 改 });
});

/** 原生叫它切屏(返回键退不动网页时,切回账号屏)。⚠️ 不发意图,避免绕一圈回来 */
window.切到 = function (页) {
  // ⚠️ 切屏要把设置的子页退回入口层 —— 不退的话下次点「设置」会直接落进
  //    上回那个子页,而底栏上写着「设置」,人会以为自己点错了。
  当前页 = 页; 编辑轮换 = false; 展开的 = null; 设置页 = '';
  换底栏(页); 重绘();
};

/**
 * 🔴 告诉原生:面板身上还有没有一层能退。
 *
 * **为什么非有不可**:`主界面.收起全屏窗()` 只认「有没有借出去的全屏窗」——
 * 面板自己这一层(设置子页 / 编辑器 / 抽屉)它**完全不知道**,于是返回键
 * **直接退掉整个 App**。编辑器从 18.11 起就带着这个洞(一次只开一个,碰得少),
 * v48 把子页从 1 个变成 6 个之后,它就成了天天撞见的事。
 * `主界面.接返回键()` 那段注释自己写着「每加一个子页都要在返回里补一条」——
 * 这是从签到线(铁律 4)搬来的教训,这回补上了,而且**一个机制盖住三样**。
 *
 * ⚠️ **叫它的地方只有一处:`收尾()` 开头**(每一屏画完都会过那儿)。
 *    散在各个 handler 里迟早漏一个,而漏掉的症状是「返回键偶尔退掉整个 App」——
 *    偶发、没日志、复现不了,最难查的那一类。
 * ⚠️ **变了才报**:`重绘` 一秒最多四次,每次都过桥是白烧;而且去重之后
 *    放在 `收尾` 里等于零成本。
 * ⚠️ 旧 APK 上 `安卓.有子页` 不存在 —— try 包着,整句变空操作,
 *    行为退回「和 1.3 一样(返回键退 App)」,不会崩。
 */
var 上次报的子页 = null;
function 报有子页() {
  var 有 = !!(看日志 || 编辑中 || 设置页);
  if (有 === 上次报的子页) return;
  // ⚠️⚠️ **报成了才记账。** 第一版写成「先记账、再过桥,过不去也不回退」——
  //    那样桥只要失败过一次(WebView 正在销毁之类),JS 这头就永远以为报过了,
  //    而原生那头的旗子还停在旧值。症状是**返回键偶尔把整个 App 退掉,而且没有日志**
  //    —— 偶发、复现不了、最难查的那一类。2026-11-09 打 1.4 之前查返回键时发现的。
  // ⚠️ 旧包(1.3 及以前)没有这个桥方法 -> `安卓.有子页` 是 undefined -> 不记账,
  //    每次 收尾 都会再试一下。代价只是一个 typeof 比较,随它去。
  try {
    if (typeof 安卓 !== 'undefined' && 安卓.有子页) {
      安卓.有子页(有);
      上次报的子页 = 有;
    }
  } catch (e) { /* 没报成就【不】记账 —— 下一拍重绘会再试 */ }
}

/**
 * 返回键按下来时原生叫的:退掉盖在最上面那一层,退掉了回 true。
 *
 * ⚠️⚠️ **这儿不自己清变量,只是「替用户按一下屏幕上那个出口」。**
 *    收草稿、发 `收过往日志`、清 `弹层开的是`/`手填的` 全挂在
 *    `data-收抽屉` 那个 handler 上(18.11 说的「出口复用」)——
 *    在这儿照抄一遍就是第二份定义,迟早漏一条(铁律 8)。
 * ⚠️ 顺序是**盖在最上面的先退**,不能靠 `querySelector` 的文档顺序:
 *    顶栏(`.top`,第 422 行)排在 `#抽屉`(441)**前面**,
 *    拿一个逗号选择器会先选中设置屏那个「返回」—— 抽屉还盖着就退了底下那层。
 */
window.退一层 = function () {
  var 门 = null;
  if (看日志) 门 = document.querySelector('#抽屉 [data-收抽屉]');
  if (!门 && 编辑中) 门 = document.querySelector('[data-收抽屉]');
  if (!门 && 设置页) 门 = document.querySelector('[data-设置返回]');
  if (门) { 门.click(); return true; }
  // 旗子立着、出口却不在屏幕上 —— 不该发生。但宁可在这儿自己收掉,
  // 也不能让返回键把整个 App 退了(那正是这件事要治的病)。
  if (看日志 || 编辑中 || 设置页) {
    if (看日志) 发意图('收过往日志');
    看日志 = false; 编辑中 = null; 草稿 = null; 设置页 = '';
    弹层开的是 = null; 手填的 = {};
    画抽屉(); 重绘(); return true;
  }
  return false;
};

function 换底栏(页) {
  // 🔴 顺手把「停在哪一屏」记下来。**挂在这儿,是因为它是唯一的漏斗** ——
  //    切屏有两条路(`切到` 和派发里的 `去账号`),两条都要经过 换底栏。
  //    散着写迟早漏一条,而漏掉的症状是「有时候记得有时候不记得」,最难查。
  // ⚠️ 引擎自己发的 `切到屏`(收编完回账号、开跑跳任务)也走 `切到` ->
  //    也会被记下来。**这是对的**:用户原话是「按照最后一次停留的地方」,
  //    引擎把他送到哪儿,那儿就是他最后停留的地方。
  try { localStorage.setItem(屏记忆键, 页); } catch (e) {}
  [].forEach.call(document.getElementById('底栏').children, function (c) {
    c.classList.toggle('on', c.dataset.页 === 页);
  });
}

/* 🔴 2026-11-05 这里原来是 `接拖动()` —— 自己用 pointer events 做的拖动排序,
   账号屏和任务屏共用。**两边都拆了,函数整个删掉。**

   任务屏(上午):顺序改成「勾的先后」,⠿ 没有存在的理由了。
   账号屏(下午):⠿ 拖动在真机上**一次都没成功过** —— `动()` 里 `兄弟.after(行)`
       把正在拖的那一行在 DOM 里搬家,pointer capture 当场作废,pointerup 落不回手柄,
       `松()` 不跑 -> 顺序不存、行卡在半路。实拍三连证写在 `画账号` 那段注释上。
   ⚠️ 要是哪天又想做拖动排序:**别再从这个形状起手**。搬 DOM 的那一刻就输了;
      要么只改 transform、松手那一下才真排序,要么老老实实用 ▲▼。
   ⚠️ `case '重排'` / `case '任务排序'` 在状态机里【都还在】,别跟着删:
      ▲▼ 现在就走 `重排`。 */

// ══ 倒计时 ════════════════════════════════════════════
// 【在这里自己算】—— 快照给的是绝对时间戳。这就是「服务不必为了刷倒计时每秒推一次」
// 换来的东西(core/快照字段.md §0 第 2 条)。
setInterval(function () {
  var el = document.getElementById('倒计时');
  if (!el || !快照) return;
  // ⚠️ 歇着的时候【别倒数】—— `下一条发于` 那个时刻在暂停期间是冻住不动的,
  //    照着它数会一路数到 0 然后卡在「0 秒」,看着像死机。
  //    (真正的冻结在状态机里:`继续` 那一下把歇了多久从这些时刻里补回去。)
  if (快照.手动暂停) { el.textContent = '已暂停'; return; }
  if (!快照.下一条发于) { el.textContent = '—'; return; }
  var 还有 = Math.max(0, Math.round((快照.下一条发于 - Date.now()) / 1000));
  el.textContent = 还有 + ' 秒';
}, 1000);

// 版本信息是【原生状态】不进快照(更新器刻意住在层 1,见 更新器.java 文件头)
/**
 * 原生 -> 面板,推版本实况。**一根单独的线,不走快照**(它是原生状态,不是业务事实)。
 *
 * ⚠️⚠️ **两种形状都要认,而且会长期并存**:
 *    · 1.3 及以前:一句人话(`更新器.现状()` 吐的 `远程 v2 · 试用中`)
 *    · 之后:JSON(多了包版本、打包标记、上次查、上次结果、有没有新包)
 *    面板能远程更新、APK 不能 —— **新面板落在旧原生上是常态**,不是过渡期。
 * ⚠️ 认不出就当成「只有脚本那一条」,别抛 —— 抛了这根线就断了,整页都没版本。
 */
window.版本 = function (v) {
  var o = null;
  if (v && typeof v === 'object') o = v;
  else { try { o = JSON.parse(v); } catch (e) { o = null; } }
  版本实况 = (o && typeof o === 'object') ? o : { 脚本: (v || '—') };
  版本信息 = 版本实况.脚本 || '—';
  if (当前页 === '设置') 重绘();
};

// 原生推权限状态过来 —— 没悬浮窗的话页面后台 67 秒就停摆,这条必须说清楚为什么
window.提示 = function (缺浮窗) {
  var b = document.getElementById('横幅');
  b.style.display = 缺浮窗 ? 'block' : 'none';
  if (缺浮窗) {
    b.textContent = '⚠️ 还没给悬浮窗权限 —— 没有它,页面退到后台 67 秒就会停摆,挂机跑不了。点这里去开';
    b.onclick = function () { if (window.安卓 && 安卓.去开悬浮窗) 安卓.去开悬浮窗(); };
  }
};

/**
 * 把「我的顶栏多高、底栏多高」报给原生,它照着给浏览器留边。
 * ⚠️ 为什么让面板报:底栏是这里的 HTML,加一个 tab、改一次字号高度就变了。
 *    原生写死两边迟早对不上(而且对不上的表现是浏览器盖住半条底栏,很难看出原因)。
 * ⚠️ 面板的 viewport 是 width=device-width,所以 1 CSS px = 1 dp;
 *    乘 devicePixelRatio 才是原生要的设备像素。
 */
var 上次留边 = '';
/**
 * 报底盘留边。⚠️ `强制=true` 的那一路【不许去重】。
 *
 * 2026-09-27 踩过:加了去重之后,原生 `onServiceConnected` 那次补发被吃掉了 ——
 * 而那次补发存在的理由正是「面板载完 60ms 就报过一次,当时服务还没绑上,意图被丢」。
 * 去重把「第一次发丢了」和「这次没必要发」混成一件事 → 顶边/底边 一直 0 →
 * **浏览器铺满整屏,顶栏、窗口条、底栏全被盖住**。
 * 去重只该省掉「重绘触发的那些」,永远不该挡住显式补发。
 */
window.报留边 = function (强制) {
  var 顶 = document.querySelector('.top');
  var 条 = document.getElementById('窗口条');   // ⚠️ 它一出现顶边就厚了,不算进去浏览器会被盖住
  var 跑 = document.getElementById('跑条');     // ⚠️ 同上。2026-10-24 新加的,漏算它 = 横幅被浏览器盖住
  var 底 = document.getElementById('底栏');
  var r = window.devicePixelRatio || 1;
  var 高 = function (e) { return e ? e.getBoundingClientRect().height : 0; };
  var 顶px = Math.round((高(顶) + 高(条) + 高(跑)) * r);
  var 底px = Math.round(高(底) * r);
  // ⚠️ 只在变了的时候报 —— 每次重绘都发一遍等于给原生加一条没用的消息流
  var 签 = 顶px + '/' + 底px;
  if (!强制 && 签 === 上次留边) return;
  上次留边 = 签;
  发意图('报底盘留边', { 顶: 顶px, 底: 底px });
};
// ⚠️⚠️ **必须包一层,不能把 报留边 直接当 listener。**
// 监听器会把 Event 对象当第一个实参传进去,而第一个形参正好是 `强制` ——
// 于是**每一次 resize 都成了「强制上报」,上面那道去重整个失效**。
// 后果不是「多发一条没用的消息」那么轻:每发一次,状态机就记一行
// 「底盘留边 顶=… 底=…」-> `日志` 变了 -> 快照变了 -> 原生推 画() ->
// `重绘()` 把 `内容` 整个换掉 -> **正在打字的输入框连同焦点一起没,键盘当场收回去**。
// 2026-11-09 实测:弹一次键盘,一模一样的「顶=120 底=0」连记三条,
// 三次重绘,中间那次正好把焦点踢掉(见 收尾() 里那一大段)。
window.addEventListener('resize', function () { 报留边(); });

/* 🔴 键盘弹起来时,把底下那块地让出来(2026-11-08,跟编辑器改成一页是一套)。
 *
 * ⚠️⚠️ 2026-11-09 实测之后这一段的身份变了:**它现在是兜底,不是主力。**
 *    真正让地的是原生那一头 —— 主界面.java 的 insets listener 把
 *    WindowInsets.Type.ime() 一起吃进 padding,WebView 自己就缩了
 *    (实测 innerHeight 808 -> 495)。窗口一缩,innerHeight 和
 *    visualViewport.height 一起缩,所以**下面这个差值恒为 0**。
 *    留着它是为了「万一哪天窗口又不缩了」—— 换 ROM、动 targetSdk、
 *    或者有人把那个 listener 改回去,那时候 visualViewport 还看得见键盘。
 * ⚠️ 别再照 2026-11-08 写的那套去想「系统在 adjustResize / adjustPan 里挑一个」:
 *    targetSdk 35+ 强制 edge-to-edge 之后**两个都不是** —— 系统谁也不挑,
 *    它只把 ime() 这条 inset 交给你,吃不吃是应用自己的事。
 *    manifest 里那句 adjustResize 是空话(证据写在那一行的注释里)。
 * ⚠️ 只给 `.body` 加 padding-bottom,【不碰任何 position:fixed 的东西】——
 *    挪 fixed 元素正是抽屉那套做法,而那套做法就是这次要治的病。
 * ⚠️ 60px 那道闸:比这还小的变化多半是地址栏/圆角/系统手势条,不是键盘。
 */
function 盯键盘() {
  var vv = window.visualViewport;
  var 让 = vv ? (window.innerHeight - vv.height - vv.offsetTop) : 0;
  if (!(让 > 60)) 让 = 0;
  document.documentElement.style.setProperty('--键盘', Math.round(让) + 'px');
  // ⚠️ 键盘是在【焦点已经进去之后】才弹起来的,所以浏览器那一次
  //    「把焦点滚进视野」发生在让地之前 —— 不自己补一刀,正在打字的那个框
  //    还是会留在键盘底下。
  var el = document.activeElement;
  if (让 && el && el.closest && el.closest('.body') && el.scrollIntoView) {
    setTimeout(function () { el.scrollIntoView({ block: 'center' }); }, 0);
  }
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', 盯键盘);
  visualViewport.addEventListener('scroll', 盯键盘);
}

// ⚠️ 底栏那个 `class="on"` 是写死在 HTML 里的首帧高亮(挂在「账号」那一格)。
//    开机要是从记忆里读到了别的屏,得把高亮对齐过去,否则会出现
//    「内容是任务屏、底下亮的是账号」这种一看就坏掉的样子。
换底栏(当前页);

// 告诉原生:我准备好了,可以推第一份快照
if (window.安卓 && 安卓.面板就绪) 安卓.面板就绪();
重绘();
// ⚠️ 要等一帧再量 —— 刚 setContentView 时高度还是 0
setTimeout(报留边, 60);
</script>
</body>
</html>
